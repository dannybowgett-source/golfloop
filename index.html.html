function screenTripGroupScoring(){
  var live=S.live;var trip=getTrip();
  if(!live||!trip){setState({screen:'tripHome'});return}

  // Find my group
  var myGroup=null;var myGroupIdx=-1;
  (live.groups||[]).forEach(function(g,gi){
    if(g&&g.players&&g.players.indexOf(S.myName)>=0){myGroup=g;myGroupIdx=gi;}
  });
  if(!myGroup){setState({screen:'tripHome'});return}

  var pars=live.pars||Array(18).fill(4);
  var hdcp=live.hdcp||Array(18).fill(10);
  var groupPlayers=myGroup.players.map(function(name){
    var p=(live.players||[]).find(function(p2){return p2.name===name});
    if(!p)p=(trip.players||[]).find(function(p2){return p2.name===name});
    return p||{name:name,handicap:18,scores:Array(18).fill(0)};
  });

  // Initialize group scores
  if(!S.tripScores)S.tripScores={};
  groupPlayers.forEach(function(p){
    if(!S.tripScores[p.name]){
      S.tripScores[p.name]=(p.scores&&p.scores.some(function(s){return s>0}))?p.scores.slice():Array(18).fill(0);
    }
  });

  var par=pars[S.hole];var hcpRank=hdcp[S.hole];
  var totalHoles=live.holes||18;
  var done=S.tripScores[groupPlayers[0].name]?S.tripScores[groupPlayers[0].name].filter(function(s){return s>0}).length:0;

  setHdr(live.name,myGroup.name+' Scoring');
  var wrap=h('div',{style:{display:'flex',flexDirection:'column',minHeight:'100vh'}});

  // Progress
  var progWrap=h('div',{style:{padding:'8px 20px 0'}});
  var pb=h('div',{className:'pb'});var pf=h('div',{className:'pf',style:{width:(done/totalHoles*100)+'%'}});pb.appendChild(pf);
  var pt=h('div',{style:{fontSize:'11px',color:'var(--dim)',textAlign:'right'}});pt.textContent=done+'/'+totalHoles+' holes';
  progWrap.appendChild(pb);progWrap.appendChild(pt);wrap.appendChild(progWrap);

  // Hole navigator
  var prevBtn=h('button',{className:'nb',disabled:S.hole===0,onClick:function(){S.hole--;setState({screen:'tripGroupScoring'})}});prevBtn.textContent='<';
  var nextBtn=h('button',{className:'nb',disabled:S.hole===totalHoles-1,onClick:function(){S.hole++;setState({screen:'tripGroupScoring'})}});nextBtn.textContent='>';
  var holeCtr=h('div',{style:{textAlign:'center'}});
  var myHcpTG=(groupPlayers.find(function(p){return p.name===S.myName})||{}).handicap||18;
  var strokesTGH=myHcpTG>=hcpRank?1:0;
  holeCtr.appendChild(h('div',{style:{fontSize:'10px',color:'var(--dim)',letterSpacing:'2px',textTransform:'uppercase'}},'Hole'));
  holeCtr.appendChild(h('div',{style:{fontSize:'30px',color:'var(--gold)',fontWeight:'700',lineHeight:'1.1'}},String(S.hole+1)));
  holeCtr.appendChild(h('div',{style:{fontSize:'12px',color:'var(--dim)',textTransform:'uppercase'}},'Par '+par));
  holeCtr.appendChild(h('div',{style:{fontSize:'11px',color:strokesTGH?'var(--gold)':'var(--dim)'}},'Hdcp '+hcpRank+(strokesTGH?' · +1 stroke':'')));
  wrap.appendChild(h('div',{className:'hnav'},[prevBtn,holeCtr,nextBtn]));

  // Hole dots -- filled style
  function hapticTG(p){if(navigator.vibrate)navigator.vibrate(p||8);}
  var dots=h('div',{style:{display:'flex',gap:'4px',flexWrap:'wrap',padding:'6px 16px'}});
  pars.slice(0,totalHoles).forEach(function(_,hh){
    var allScored=groupPlayers.every(function(p){return S.tripScores[p.name]&&S.tripScores[p.name][hh]>0});
    var isCurTG=hh===S.hole;
    var bg='transparent',border='1px solid rgba(255,255,255,.12)',col='rgba(245,237,216,0.3)';
    if(isCurTG){border='2px solid var(--gold)';col='var(--gold)';}
    else if(allScored){bg='rgba(255,255,255,.2)';border='1px solid rgba(255,255,255,.3)';col='rgba(245,237,216,0.9)';}
    var d=h('div',{style:{width:'22px',height:'22px',borderRadius:'50%',background:bg,border:border,color:col,display:'flex',alignItems:'center',justifyContent:'center',fontSize:'8px',fontWeight:'700',cursor:'pointer'},
      onClick:function(){S.hole=hh;setState({screen:'tripGroupScoring'})}});
    d.textContent=hh+1;dots.appendChild(d);
  });
  wrap.appendChild(dots);

  var scrollArea=h('div',{style:{flex:'1',overflowY:'auto',padding:'0 12px',display:'flex',flexDirection:'column',gap:'6px'}});
  var pushTimer3=null;
  var tgSteppers=[];
  var avatarColorsTG=['#C9A84C','#60a5fa','#f472b6','#fb923c','#a78bfa','#34d399'];

  function pushTGScores(){
    if(pushTimer3)clearTimeout(pushTimer3);
    pushTimer3=setTimeout(function(){
      if(S.live){
        var upP=(S.live.players||[]).map(function(p2){return S.tripScores[p2.name]?Object.assign({},p2,{scores:S.tripScores[p2.name].slice()}):p2});
        pushLive(Object.assign({},S.live,{players:upP}));
      }
    },600);
  }

  groupPlayers.forEach(function(p,pi){
    var strokesTG=p.handicap>=hcpRank?1:0;
    var curVal=S.tripScores[p.name][S.hole]||0;
    var initTG=(p.name||'?').split(' ').map(function(w){return w[0];}).join('').slice(0,2).toUpperCase();
    var avTG=h('div',{style:{width:'26px',height:'26px',borderRadius:'50%',background:avatarColorsTG[pi%avatarColorsTG.length],display:'flex',alignItems:'center',justifyContent:'center',fontSize:'10px',fontWeight:'700',color:'#000',flexShrink:'0'}});
    avTG.textContent=initTG;
    var nmTG=h('div',{style:{fontSize:'13px',fontWeight:'700',color:'var(--cream)',lineHeight:'1.2'}});nmTG.textContent=p.name+(p.name===S.myName?' (you)':'');
    var hcpTG=h('div',{style:{fontSize:'10px',color:strokesTG?'var(--gold)':'var(--dim)'}});
    hcpTG.textContent='HCP '+p.handicap+(strokesTG?' · +1 stroke':'');
    var nmDivTG=h('div',{style:{flex:'1',marginLeft:'8px'}});nmDivTG.appendChild(nmTG);nmDivTG.appendChild(hcpTG);
    var hdrTG=h('div',{style:{display:'flex',alignItems:'center',marginBottom:'6px'}});hdrTG.appendChild(avTG);hdrTG.appendChild(nmDivTG);
    var pc=h('div',{style:{background:'rgba(16,16,16,.95)',border:'1px solid rgba(255,255,255,.07)',borderRadius:'10px',padding:'8px 10px'}});
    pc.appendChild(hdrTG);
    // Pre-populate par if no score yet
    if(!curVal){S.tripScores[p.name][S.hole]=par;curVal=par;}
    var stpTG=buildStepper(curVal,par,function(val){
      hapticTG(8);
      S.tripScores[p.name][S.hole]=val;
      pushTGScores();
      // Auto-advance to next player after 300ms
      if(val>0&&pi<tgSteppers.length-1){
        setTimeout(function(){
          // Focus next stepper's minus button area -- scroll into view
          var nextCard=scrollArea.children[pi+1];
          if(nextCard)nextCard.scrollIntoView({behavior:'smooth',block:'nearest'});
        },300);
      }
    });
    tgSteppers.push(stpTG);
    pc.appendChild(stpTG.container);
    scrollArea.appendChild(pc);
  });

  // Swipe navigation
  var swTGX=null,swTGY=null;
  wrap.addEventListener('touchstart',function(e){swTGX=e.touches[0].clientX;swTGY=e.touches[0].clientY;},{passive:true});
  wrap.addEventListener('touchend',function(e){
    if(swTGX===null)return;
    var dx=e.changedTouches[0].clientX-swTGX,dy=e.changedTouches[0].clientY-swTGY;
    if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5){
      if(dx<0&&S.hole<totalHoles-1){hapticTG(8);S.hole++;setState({screen:'tripGroupScoring'});}
      else if(dx>0&&S.hole>0){hapticTG(8);S.hole--;setState({screen:'tripGroupScoring'});}
    }
    swTGX=null;swTGY=null;
  },{passive:true});

  wrap.appendChild(scrollArea);

  // Submit button -- Next Hole until last
  var warnMsg3=h('div',{style:{display:'none',color:'#e87070',fontSize:'12px',textAlign:'center',padding:'4px 0'}});
  var isLastTG=S.hole>=totalHoles-1;
  var subBtn3=btn('bp',isLastTG?'Submit Group Scores':'Next Hole →',function(){
    if(!isLastTG){S.hole++;setState({screen:'tripGroupScoring'});return;}
    var missing3=0;
    groupPlayers.forEach(function(p){
      for(var hh=0;hh<totalHoles;hh++){if(!S.tripScores[p.name][hh])missing3++;}
    });
    if(missing3>0){warnMsg3.style.display='block';warnMsg3.textContent='Missing '+missing3+' score'+(missing3>1?'s':'')+' across your group';return}
    warnMsg3.style.display='none';subBtn3.disabled=true;subBtn3.textContent='Submitting...';
    // Update all players scores and mark as submitted
    var upPlayers=(live.players||[]).map(function(p){
      if(S.tripScores[p.name])return Object.assign({},p,{scores:S.tripScores[p.name].slice()});
      return p;
    });
    // Add any group players not yet in live round
    groupPlayers.forEach(function(p){
      var inLive=upPlayers.some(function(p2){return p2.name===p.name});
      if(!inLive)upPlayers.push(Object.assign({},p,{scores:S.tripScores[p.name].slice()}));
    });
    var newSubs=Object.assign({},live.teamSubmissions||{});
    groupPlayers.forEach(function(p){newSubs[p.name]=true});
    var updated=Object.assign({},live,{players:upPlayers,teamSubmissions:newSubs});
    pushLive(updated).then(function(){
      S.groupScoring=false;
      var allSub=(trip.players||[]).every(function(p){return updated.teamSubmissions[p.name]});
      if(allSub)finalizeTripRound(updated,trip);
      else setState({screen:'tripHome'});
    });
  });
  var lbBtn3=h('button',{style:{background:'none',border:'none',color:'var(--dim)',fontSize:'12px',cursor:'pointer',padding:'4px 8px',textAlign:'center',width:'100%'},onClick:function(){setState({screen:'tripLeaderboard'})}});
  lbBtn3.textContent='Leaderboard';
  wrap.appendChild(h('div',{className:'fbar',style:{display:'flex',flexDirection:'column',gap:'2px',padding:'8px 16px'}},[subBtn3,warnMsg3,lbBtn3]));
  return wrap;
}

function scrambleNet(grossScore,teamHandicap,hole,pars,hdcp){
  // Apply team handicap strokes per hole
  var strokes=teamHandicap>=hdcp[hole]?1:0;
  if(teamHandicap>=(hdcp[hole]+18))strokes=2;
  return Math.max(1,grossScore-strokes);
}

function isEventAdmin(ev){
  if(S.isAdmin||loc.get('gs_admin',false))return true;
  if(S.isTripAdmin&&ev&&S.myTripAdminId===ev.id)return true;
  // Event organiser check by localStorage
  var orgEvId=S.myEventOrganiserId||loc.get('gs_event_organiser',null);
  if(orgEvId&&ev&&orgEvId===ev.id)return true;
  // Name match fallback
  if(ev&&ev.organiserName&&S.myName&&ev.organiserName.toLowerCase()===S.myName.toLowerCase()){
    var storedEvId=S.myEventId||loc.get('gs_event_id',null);
    if(storedEvId&&storedEvId===ev.id)return true;
  }
  return false;
}

function screenEventTeams(){
  var ev=getEvent();if(!ev){setState({screen:'home'});return}
  var isTeamFmt=['Scramble','Best Ball'].indexOf(ev.format)>=0;
  var groupLabel=isTeamFmt?'Teams':'Groups';
  setHdr(groupLabel,ev.name);
  var root=h('div',{className:'screen'});
  var teams=ev.teams||[];
  var players=ev.players||[];
  var unassigned=players.filter(function(p){return !p.teamId});
  var maxPerGroup=ev.teamSize===1?4:ev.teamSize;

  function saveAndRefresh(newEv){
    return pushEvent(newEv).then(function(){setState({screen:'eventTeams'});});
  }

  // ── AUTO-CREATE GROUPS ────────────────────────────────────────────────────
  if(players.length>=2){
    var autoCard=card('Auto-Build '+groupLabel);
    var autoHint=h('div',{style:{fontSize:'12px',color:'var(--dim)',marginBottom:'10px'}});
    autoHint.textContent='Instantly create balanced groups from all '+(players.length)+' players';
    autoCard.appendChild(autoHint);
    var autoRow=h('div',{style:{display:'flex',gap:'8px'}});

    function autoCreate(mode){
      var shuffled=players.slice();
      if(mode==='random'){
        for(var i=shuffled.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var tmp=shuffled[i];shuffled[i]=shuffled[j];shuffled[j]=tmp;}
      } else if(mode==='handicap'){
        // Snake draft by handicap (best to worst, snake)
        shuffled.sort(function(a,b){return a.handicap-b.handicap});
        var rows=[];var n=Math.ceil(shuffled.length/maxPerGroup);
        for(var g=0;g<n;g++)rows.push([]);
        shuffled.forEach(function(p,i){
          var row=Math.floor(i/maxPerGroup);
          var pos=i%maxPerGroup;
          var grpIdx=row%2===0?pos:(maxPerGroup-1-pos);
          if(rows[grpIdx])rows[grpIdx].push(p);else rows[pos].push(p);
        });
        shuffled=[];rows.forEach(function(r){r.forEach(function(p){shuffled.push(p);})});
      }
      var newTeams=[];
      for(var gi=0;gi<Math.ceil(shuffled.length/maxPerGroup);gi++){
        var grpPlayers=shuffled.slice(gi*maxPerGroup,(gi+1)*maxPerGroup);
        newTeams.push({id:uid(),name:groupLabel.slice(0,-1)+' '+(gi+1),players:grpPlayers.map(function(p){return p.name;}),scorer:grpPlayers[0].name,paid:false});
      }
      var upPlayers=players.map(function(p){
        var grp=newTeams.find(function(t){return t.players.indexOf(p.name)>=0});
        return Object.assign({},p,{teamId:grp?grp.id:null});
      });
      saveAndRefresh(Object.assign({},ev,{teams:newTeams,players:upPlayers}));
    }

    var rndBtn=h('button',{style:{flex:'1',height:'38px',borderRadius:'8px',border:'1px solid rgba(201,168,76,.3)',background:'rgba(201,168,76,.08)',color:'var(--gold)',fontSize:'12px',fontWeight:'600',cursor:'pointer'},onClick:function(){autoCreate('random');}});rndBtn.textContent='🎲 Random';
    var hcpBtn=h('button',{style:{flex:'1',height:'38px',borderRadius:'8px',border:'1px solid rgba(201,168,76,.3)',background:'rgba(201,168,76,.08)',color:'var(--gold)',fontSize:'12px',fontWeight:'600',cursor:'pointer'},onClick:function(){autoCreate('handicap');}});hcpBtn.textContent='⚖️ By Handicap';
    autoRow.appendChild(rndBtn);autoRow.appendChild(hcpBtn);
    autoCard.appendChild(autoRow);
    root.appendChild(autoCard);
  }

  // ── UNASSIGNED PLAYERS -- chip pool ────────────────────────────────────────
  if(unassigned.length>0){
    var poolCard=card('Unassigned Players ('+unassigned.length+')');
    var chipPool=h('div',{style:{display:'flex',flexWrap:'wrap',gap:'6px',marginBottom:'4px'}});
    unassigned.forEach(function(p){
      var chip=h('div',{style:{
        padding:'5px 10px',borderRadius:'16px',background:'rgba(255,255,255,.06)',
        border:'1px solid rgba(255,255,255,.12)',color:'var(--cream)',
        fontSize:'12px',fontWeight:'600',cursor:'pointer',userSelect:'none',
        display:'flex',alignItems:'center',gap:'4px',transition:'background .12s'
      }});
      var initials=(p.name||'?').split(' ').map(function(w){return w[0];}).join('').slice(0,2).toUpperCase();
      chip.innerHTML='<span style="font-size:10px;opacity:.6">'+initials+'</span> '+p.name+' <span style="font-size:10px;opacity:.5">'+p.handicap+'</span>';
      // If there are groups, clicking chip shows which group to add to
      if(teams.length>0){
        chip.title='Tap to assign to a group';
        chip.style.cursor='pointer';
        chip.addEventListener('click',function(){
          // Find first group with space
          var targetGroup=teams.find(function(t){return t.players.length<maxPerGroup;});
          if(!targetGroup)return;
          var upTeams=teams.map(function(tt){
            if(tt.id!==targetGroup.id)return tt;
            var np=tt.players.concat([p.name]);
            return Object.assign({},tt,{players:np,scorer:tt.scorer||p.name});
          });
          var upPlayers=players.map(function(p2){return p2.name===p.name?Object.assign({},p2,{teamId:targetGroup.id}):p2;});
          saveAndRefresh(Object.assign({},ev,{teams:upTeams,players:upPlayers}));
        });
      }
      chipPool.appendChild(chip);
    });
    poolCard.appendChild(chipPool);
    if(teams.length===0){var hint2=h('div',{style:{fontSize:'11px',color:'var(--dim)',marginTop:'6px'}});hint2.textContent='Create a group below to start assigning players';poolCard.appendChild(hint2);}
    root.appendChild(poolCard);
  }

  // ── ADD GROUP MANUALLY ────────────────────────────────────────────────────
  var newTeamName='';
  var teamNameInp=h('input',{className:'inp',placeholder:isTeamFmt?'Team name e.g. "The Bogey Boys"':'Group name e.g. "Group 1"',style:{height:'40px',fontSize:'14px'}});
  teamNameInp.addEventListener('input',function(){newTeamName=this.value});
  var addTeamBtn=btn('bp','+ Add '+(isTeamFmt?'Team':'Group'),function(){
    if(!newTeamName.trim())return;
    var newTeam={id:uid(),name:newTeamName.trim(),players:[],scorer:null,paid:false};
    saveAndRefresh(Object.assign({},ev,{teams:teams.concat([newTeam])}));
  });
  root.appendChild(card('Add '+(isTeamFmt?'Team':'Group'),[teamNameInp,h('div',{style:{height:'6px'}}),addTeamBtn]));

  // ── GROUPS LIST ────────────────────────────────────────────────────────────
  if(teams.length){
    var teamsCard=card(groupLabel+' ('+teams.length+')');
    teams.forEach(function(t,tidx){
      var td=h('div',{style:{marginBottom:'14px',paddingBottom:'14px',borderBottom:'1px solid rgba(255,255,255,.05)'}});

      // Group header
      var th2=h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'8px'}});

        fontSize:'10px',cursor:'pointer',fontWeight:'500'
      },onClick:function(){
        var upTeams=teams.map(function(tt){return tt.id===t.id?Object.assign({},tt,{paid:!tt.paid}):tt});

// Calculate a team's score for an event round based on format
function eventTeamScore(team,liveRound){
  var pars=liveRound.pars||PARS.slice();
  var hdcp=liveRound.hdcp||HDCP.slice();
  var fmt=liveRound.format||'Scramble';
  if(fmt==='Stableford'){
    // Sum stableford points for each player, take best per hole (best ball stableford)
    // or sum all if individual stableford - use sum of individual player scores
    var playerScores=team.playerScores||{};
    var total=0;
    pars.forEach(function(_,h){
      var bestPts=0;
      var hasAny=false;
      Object.keys(playerScores).forEach(function(name){
        var sc=playerScores[name];
        if(sc&&sc[h]){hasAny=true;var pts=stablefordPts(sc[h],team.playerHandicaps&&team.playerHandicaps[name]||team.avgHandicap||18,hdcp[h],pars[h]);if(pts>bestPts)bestPts=pts;}
      });
      if(!hasAny&&team.scores&&team.scores[h]){
        bestPts=stablefordPts(team.scores[h],team.avgHandicap||18,hdcp[h],pars[h]);
      }
      total+=bestPts;
    });
    return total;
  }
  if(liveRound.netScoring){
    return team.scores.reduce(function(sum,g,h){return sum+(g?scrambleNet(g,team.avgHandicap||0,h,pars,hdcp):0)},0);
  }
  return team.scores.reduce(function(a,b){return a+b},0);
}

function finalizeEvent(liveRound,ev){
  var pars=liveRound.pars||PARS.slice();
  var hdcp=liveRound.hdcp||HDCP.slice();
  var fmt=liveRound.format||'Scramble';
  var holes=liveRound.holes||18;
  // Calculate totals per team
  (liveRound.teams||[]).forEach(function(t){
    t.grossTotal=t.scores.reduce(function(a,b){return a+b},0);
    if(fmt==='Stableford'){
      t.stablefordTotal=eventTeamScore(t,liveRound);
    } else if(liveRound.netScoring){
      t.netTotal=t.scores.reduce(function(sum,g,h){return sum+(g?scrambleNet(g,t.avgHandicap||0,h,pars,hdcp):0)},0);
    }
  });

  // Calculate skins
  var skinsResult=null;
  if(ev.skins&&ev.skins.active){
    var useNetSkins=liveRound.netScoring||false;
    var isSinglesEv2=ev.teamSize===1;
    // For singles: rename each team entry to the player's name so skins display by player, not group
    var skinsTeams=(liveRound.teams||[]).map(function(t){
      return isSinglesEv2?Object.assign({},t,{name:t.players[0]||t.name}):t;
    });
    skinsResult=calcSkinsTeams(skinsTeams,holes,pars,hdcp,useNetSkins);
    // Calculate winnings: pot = amount * num players, split among skin winners
    var totalPlayers=(liveRound.teams||[]).reduce(function(n,t){return n+t.players.length},0);
    var totalPot=(ev.skins.amountPerPlayer||10)*totalPlayers;
    var totalSkins=Object.values(skinsResult.cnt).reduce(function(a,b){return a+b},0);
    skinsResult.totalPot=totalPot;
    skinsResult.winnings={};
    if(totalSkins>0){
      skinsTeams.forEach(function(t){
        if(skinsResult.cnt[t.id]>0){
          skinsResult.winnings[t.name]=Math.round((skinsResult.cnt[t.id]/totalSkins)*totalPot*100)/100;
        }
      });
    }
    skinsResult.teamNames={};
    skinsTeams.forEach(function(t){skinsResult.teamNames[t.id]=t.name});
  }

  // Calculate nassau
  var nassauResult=null;
  if(ev.nassau&&ev.nassau.active){
    var nassauEntries=(liveRound.teams||[]).map(function(t){
      var useNS=liveRound.netScoring;
      return{id:t.id,name:t.name,holeScore:function(h){
        var g=t.scores[h]||0;
        if(!g)return 0;
        return useNS?Math.max(1,g-(t.avgHandicap>=hdcp[h]?1:0)):g;
      }};
    });
    nassauResult=calcNassau(nassauEntries,holes,pars,hdcp,liveRound.netScoring);
    nassauResult.amountPerLeg=ev.nassau.amountPerLeg||5;
  }

  // Calculate Vegas
  var vegasResult=null;
  if(ev.vegas&&ev.vegas.active&&(liveRound.teams||[]).length===2){
    var vegasTeams=(liveRound.teams||[]).map(function(t){return Object.assign({},t,{_evPlayers:ev.players||[]});});
    vegasResult=calcVegas(vegasTeams,holes,pars,hdcp,ev.vegas.dollarPerPoint||1,liveRound.netScoring||false);
  }

  var finished=Object.assign({},liveRound,{finalized:true,finished:true,skinsResult:skinsResult,nassauResult:nassauResult,vegasResult:vegasResult});
  var updatedEv=Object.assign({},ev,{status:'complete',lastResult:finished});
  // Write activity feed items
  writeFeedItem('event',ev.id,ev.name,'round_complete','','Round complete at '+(liveRound.courseName||ev.courseName||'the course')+' 🏁');
  // Top scorer
  if(liveRound.teams&&liveRound.teams.length){
    var topT=liveRound.teams.slice().sort(function(a,b){return (a.grossTotal||0)-(b.grossTotal||0)})[0];
    if(topT&&topT.name)writeFeedItem('event',ev.id,ev.name,'leaderboard_move',topT.name,topT.name+' leads the leaderboard 🔼');
  }
  // Skins winners
  if(skinsResult&&skinsResult.winnings){
    Object.keys(skinsResult.winnings).forEach(function(name){
      var amt=skinsResult.winnings[name];
      writeFeedItem('event',ev.id,ev.name,'skins_won',name,name+' won $'+amt+' in skins 💰');
    });
  }
  Promise.all([pushLive(finished),pushEvent(updatedEv)]).then(function(){
    S._completedRound=finished;
    setState({screen:'roundComplete'});
  });
}

function screenEventLeaderboard(){

  setHdr(ev.name,'Leaderboard');

  var round=live||finished;

  if(!round){
    var nd2=h('div',{style:{textAlign:'center',padding:'30px 0',color:'var(--dim)'}});

    root.appendChild(nd2);

  var pars=round.pars||PARS.slice();
  var hdcp=round.hdcp||HDCP.slice();
  var medals2=['🥇','🥈','🥉'];
  var useNet=round.netScoring;
  var isSinglesLb=ev.teamSize===1;
  var isStablefordEv=round.format==='Stableford';

  // For singles events, always use individual net (handicap strokes per hole)
  function playerNet(t){
    // For singles: t.players[0] is the player name, find their handicap from ev.players
    var hcp=t.avgHandicap||0;
    if(isSinglesLb){
      var evP=(ev.players||[]).find(function(p){return p.name===t.players[0]});
      if(evP)hcp=evP.handicap||0;
    }
    return t.scores.reduce(function(s,g,h){
      if(!g)return s;
      return s+Math.max(1,g-(hcp>=hdcp[h]?1:0));
    },0);

  function playerGross(t){return t.scores.reduce(function(s,g){return s+g},0);}

  });
  root.appendChild(lbCard);

  // Admin force finalise
  // ── Skins results card ───────────────────────────────────────────────────────
  var skRes=round.skinsResult;

  // ── Nassau results card ───────────────────────────────────────────────────────

  if(isEventAdmin(ev)&&live&&!live.finalized){

          var newSubs2=(function(){var s=Object.assign({},live.teamSubmissions||{});(live.teams||[]).forEach(function(t){s[t.id]=true});return s})();
          var forcedLive2=Object.assign({},live,{teamSubmissions:newSubs2});

      });ffBtn2.textContent='⚡ Force Finalise';

  }

  root.appendChild(h('div',{style:{height:'8px'}}));
  // Show Back to Scoring if player is in a live team with unsubmitted scores
  if(live){
    var myLiveTeam=(live.teams||[]).find(function(t){
      return (t.players||[]).some(function(p){return p.toLowerCase().trim()===S.myName.toLowerCase().trim()});
    });
    var myLiveTeamSub=myLiveTeam&&live.teamSubmissions&&live.teamSubmissions[myLiveTeam.id];
    if(myLiveTeam&&!myLiveTeamSub){
      root.appendChild(btn('bp','← Back to Scoring',function(){setState({screen:'eventScoring'})}));
      root.appendChild(h('div',{style:{height:'4px'}}));
    }
  }
  root.appendChild(btn('bg','← Back to Event',function(){setState({screen:'eventHome'})}));
  return root;
}

pull().then(function(){
  var n=loc.get('gs_name',null);
  var isAdm=loc.get('gs_admin',false);
  var tripAdm=loc.get('gs_trip_admin',null);
  var evId=loc.get('gs_event_id',null);
  var tripId=loc.get('gs_trip_id',null);
  var orgEvId=loc.get('gs_event_organiser',null);
  if(!n){setState({screen:'login'});return}
  if(isAdm){setState({screen:'home'});return}
  if(tripAdm&&tripId){setState({screen:'tripHome'});return}
  if(orgEvId){S.myEventOrganiserId=orgEvId;S.myEventId=orgEvId;setState({screen:'eventHome'});return}
  if(evId){setState({screen:'eventHome'});return}
  if(tripId){setState({screen:'tripHome'});return}
  setState({screen:'home'});
});

// ── PWA: Service Worker & Install Prompt ─────────────────────────────────────
if('serviceWorker' in navigator && location.protocol !== 'file:'){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('sw.js').then(function(reg){
      reg.addEventListener('updatefound',function(){
        var newWorker=reg.installing;
        newWorker.addEventListener('statechange',function(){
          if(newWorker.state==='installed'&&navigator.serviceWorker.controller){
            // New version available - show subtle update banner
            var banner=document.createElement('div');
            banner.style.cssText='position:fixed;top:0;left:0;right:0;background:#C9A84C;color:#0a0a0a;padding:10px 20px;text-align:center;font-size:13px;font-weight:600;z-index:9999;cursor:pointer;max-width:480px;margin:0 auto';
            banner.textContent='Update available -- tap to refresh';
            banner.addEventListener('click',function(){window.location.reload()});
            document.body.appendChild(banner);
          }
        });
      });
    }).catch(function(e){console.log('SW registration failed:',e)});
  });
}

// Install prompt for Android (iOS uses "Add to Home Screen" manually)
var deferredPrompt=null;
window.addEventListener('beforeinstallprompt',function(e){
  e.preventDefault();
  deferredPrompt=e;
  // Show install button if not already installed
  var installBtn=document.getElementById('install-btn');
  if(installBtn)installBtn.style.display='flex';
});
window.addEventListener('appinstalled',function(){
  deferredPrompt=null;
  var installBtn=document.getElementById('install-btn');
  if(installBtn)installBtn.style.display='none';
});
function showInstallPrompt(){
  if(deferredPrompt){
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(function(){deferredPrompt=null});
  }
}
