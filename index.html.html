<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0a0a;font-family:'DM Sans',sans-serif;color:#e8e2d9;min-height:100vh;max-width:480px;margin:0 auto}

/* ── Design tokens ── */
:root{
  --gm:#0A0A0A;
  --gold:#C9A84C;--goldl:#D4B560;--cream:#F5EDD8;
  --dim:rgba(245,237,216,0.35);--dimmer:rgba(245,237,216,0.2);
  --r:12px;
  /* Spacing system */
  --sp-xs:8px;--sp-sm:12px;--sp-md:20px;--sp-lg:32px;--sp-xl:48px;
}

/* ── Header ── */
.hdr{background:rgba(10,10,10,.96);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.06);padding:12px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10}
.htitle{font-size:17px;color:var(--cream);font-weight:700;letter-spacing:-.3px}
.hsub{font-size:10px;color:var(--dim);letter-spacing:2px;text-transform:uppercase}
.logo{width:34px;height:34px;background:linear-gradient(135deg,#C9A84C,#D4B560);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}

/* ── Layout -- consistent spacing ── */
.screen{padding:var(--sp-md);display:flex;flex-direction:column;gap:var(--sp-sm);min-height:calc(100vh - 60px)}

/* ── Cards ── */
.card{background:rgba(16,16,16,.95);border:1px solid rgba(255,255,255,.07);border-radius:var(--r);padding:16px;box-shadow:0 1px 8px rgba(0,0,0,.35)}
.ct{font-size:10px;color:var(--gold);letter-spacing:2.5px;text-transform:uppercase;margin-bottom:12px;font-weight:700}

/* ── Buttons -- refined sizing + micro-interactions ── */
.btn{
  display:flex;align-items:center;justify-content:center;
  padding:9px 20px;border-radius:var(--r);border:none;
  font-size:14px;font-weight:600;cursor:pointer;width:100%;
  letter-spacing:.1px;
  transition:transform .12s ease,opacity .12s ease,box-shadow .12s ease;
  -webkit-tap-highlight-color:transparent;
}
.btn:active{transform:scale(.97);opacity:.9}

/* Primary -- gold only, clean shadow (no glow cascade) */
.bp{
  background:linear-gradient(160deg,#C9A84C,#D4B560);
  color:#0a0a0a;font-weight:700;
  box-shadow:0 2px 16px rgba(201,168,76,.22),0 1px 0 rgba(255,255,255,.08) inset;
}
.bp:active{box-shadow:0 1px 8px rgba(201,168,76,.15)}
.bp:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}

/* Secondary -- clean border, no glow */
.bs{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.1);color:var(--cream);font-weight:500}
.bs:active{background:rgba(255,255,255,.07)}

/* Ghost */
.bg{background:transparent;color:var(--dim);font-size:13px;padding:9px 14px;border:1px solid rgba(255,255,255,.05)}
.bg:active{color:var(--cream)}

/* Danger */
.bd{background:rgba(192,57,43,.1);color:#e87070;border:1px solid rgba(192,57,43,.2)}

/* ── Inputs ── */
.inp{width:100%;background:rgba(0,0,0,.35);border:1px solid rgba(201,168,76,.2);border-radius:10px;padding:11px 14px;color:var(--cream);font-size:15px;outline:none;transition:border-color .15s,box-shadow .15s}
.inp:focus{border-color:rgba(201,168,76,.45);box-shadow:0 0 0 3px rgba(201,168,76,.06)}
.inp::placeholder{color:var(--dimmer)}
.sel{appearance:none;cursor:pointer}
.sel option{background:#1a1a1a;color:#F5EDD8}
.lbl{font-size:10px;color:rgba(245,237,216,0.55);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px;display:block}

/* ── Typography helpers ── */
.text-primary{font-size:16px;color:var(--cream);font-weight:700;line-height:1.3}
.text-secondary{font-size:13px;color:var(--dim);line-height:1.5}
.text-meta{font-size:11px;color:var(--dimmer);letter-spacing:.3px}
.text-gold{color:var(--gold)}
.text-number{font-size:28px;color:var(--gold);font-weight:700;letter-spacing:-.5px;line-height:1}

/* ── Utilities ── */
.hidden{display:none!important}
.gap{display:flex;flex-direction:column;gap:var(--sp-xs)}
.row{display:flex;gap:var(--sp-xs);align-items:center}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
@keyframes glow{0%,100%{box-shadow:0 0 8px rgba(74,222,128,.15)}50%{box-shadow:0 0 20px rgba(74,222,128,.3)}}
.tabs{display:flex;gap:4px;margin-bottom:var(--sp-sm);flex-wrap:wrap}
.tab{flex:1;min-width:55px;padding:8px 4px;text-align:center;border-radius:8px;font-size:11px;cursor:pointer;border:1px solid rgba(255,255,255,.05);color:var(--dim);background:transparent;transition:background .12s}
.tab.on{background:linear-gradient(135deg,#C9A84C,#D4B560);color:#0a0a0a;font-weight:700}
/* Pill segmented control -- used for 2-item Overview/Activity toggles */
.tabs-pill{display:flex;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:999px;padding:3px;gap:0;margin-bottom:var(--sp-sm);}
.tab-pill{flex:1;padding:9px 16px;text-align:center;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;border:none;color:var(--dim);background:transparent;transition:all .2s ease;letter-spacing:.2px;}
.tab-pill.on{background:linear-gradient(135deg,#C9A84C,#D4B560);color:#0a0a0a;font-weight:700;box-shadow:0 2px 8px rgba(201,168,76,.25);}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--dim);padding:7px 5px;border-bottom:1px solid rgba(255,255,255,.05);text-align:left}
.tbl td{padding:9px 5px;font-size:13px;border-bottom:1px solid rgba(255,255,255,.03)}
.rrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.rrow:last-child{border-bottom:none}
.big{font-size:30px;color:var(--cream);font-weight:700;line-height:1}

/* ── Indicators ── */
.dot{width:7px;height:7px;border-radius:50%;background:#4ade80;display:inline-block;animation:pu 2s infinite}
.spin{width:28px;height:28px;border:2px solid rgba(201,168,76,.12);border-top-color:var(--gold);border-radius:50%;animation:sp .9s linear infinite;margin:20px auto;display:block}

/* ── Progress bar ── */
.pb{height:2px;background:rgba(255,255,255,.05);border-radius:2px;margin-bottom:8px}
.pf{height:100%;background:linear-gradient(90deg,#C9A84C,#D4B560);border-radius:2px;transition:width .4s ease}

/* ── Scoring nav ── */
.hnav{display:flex;align-items:center;justify-content:space-between;background:rgba(10,10,10,.96);border-bottom:1px solid rgba(255,255,255,.05);padding:12px 20px}
.nb{width:40px;height:40px;border-radius:50%;border:1px solid rgba(201,168,76,.25);background:transparent;color:var(--cream);font-size:18px;cursor:pointer;transition:background .12s}
.nb:active{background:rgba(201,168,76,.1)}
.nb:disabled{opacity:.2;cursor:not-allowed}
.sb{width:48px;height:48px;border-radius:50%;border:1px solid rgba(255,255,255,.07);background:rgba(0,0,0,.35);color:var(--cream);font-size:24px;cursor:pointer;flex-shrink:0;transition:background .12s}
.sb:active{background:rgba(255,255,255,.08)}
.hd{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;cursor:pointer;border:1px solid transparent;background:rgba(255,255,255,.04);color:var(--dim);transition:all .12s}
.hd.on{border:2px solid var(--gold);background:rgba(201,168,76,.1);color:var(--gold)}
.fbar{padding:12px 20px;background:rgba(10,10,10,.96);backdrop-filter:blur(16px);border-top:1px solid rgba(255,255,255,.05);position:sticky;bottom:0}

/* ── Toggle ── */
.toggle{width:44px;height:24px;border-radius:12px;background:rgba(255,255,255,.08);cursor:pointer;position:relative;flex-shrink:0;border:none;transition:background .2s}
.toggle.on{background:var(--gold)}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .2s ease;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.toggle.on::after{left:23px}

/* ── Misc ── */
.err{color:#e87070;font-size:12px;text-align:center;margin-top:6px}
.pin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.pin-btn{height:58px;border-radius:10px;border:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.03);color:var(--cream);font-size:22px;font-weight:600;cursor:pointer;transition:background .1s,transform .08s}
.pin-btn:active{background:rgba(201,168,76,.12);transform:scale(.96)}
.pin-display{display:flex;gap:12px;justify-content:center;margin:16px 0}
.pin-dot{width:14px;height:14px;border-radius:50%;border:1.5px solid rgba(201,168,76,.4);background:transparent;transition:all .15s}
.pin-dot.filled{background:var(--gold);border-color:var(--gold)}

/* ── Semantic cards ── */
/* Live round -- subtle green tint, no aggressive glow */
.card-live{background:rgba(10,18,11,.95);border:1px solid rgba(74,222,128,.15);border-radius:var(--r);padding:16px;box-shadow:0 1px 8px rgba(0,0,0,.35)}
/* Upcoming -- subtle warm tint */
.card-upcoming{background:rgba(14,12,8,.95);border:1px solid rgba(201,168,76,.15);border-radius:var(--r);padding:16px;box-shadow:0 1px 8px rgba(0,0,0,.35)}

/* ── Animations ── */
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes pu{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes scaleIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}

/* Screen entrance animation */
.screen{animation:fadeUp .18s ease}
.card{animation:scaleIn .15s ease}
</style>
</head>

<script>
window.onerror = function(msg, src, line, col, err) {
  var div = document.createElement('div');
  div.style.cssText = 'position:fixed;top:0;left:0;right:0;background:red;color:white;padding:10px;font-size:12px;z-index:99999;word-break:break-all;font-family:monospace';
  div.textContent = 'ERROR: ' + msg + ' | Line: ' + line + ' | ' + (err ? err.stack : '');
  document.body.appendChild(div);

  // Auto-recover: clear caches and reload after 3 seconds
  setTimeout(function(){
    if('caches' in window){
      caches.keys().then(function(keys){
        return Promise.all(keys.map(function(k){return caches.delete(k)}));
      }).then(function(){
        window.location.reload(true);
      });
    } else {
      window.location.reload(true);
    }
  }, 3000);

  return false;
};
</script>

<script>
var PARS=[4,3,5,4,5,4,4,3,4,4,4,3,5,4,3,4,5,4];
var HDCP=[4,14,8,18,2,10,6,16,12,7,5,15,9,3,17,1,11,13];
var PRESET_COURSES={

    ]
  },
  'Pinehurst No. 8':{
    pars:[4,5,4,4,3,5,4,3,4,4,5,4,3,4,3,4,5,4],
    hdcp:[15,9,11,5,17,1,13,7,3,6,4,18,12,8,16,10,14,2],
    tees:[
      {name:'Black', rating:75.4, slope:143, par:72},
      {name:'Gold',  rating:73.2, slope:136, par:72},
      {name:'Blue',  rating:71.1, slope:129, par:72},
      {name:'White', rating:68.9, slope:121, par:72},
      {name:'Green', rating:66.2, slope:112, par:72}
    ]
  },
  'Pinehurst No. 10':{
    pars:[4,3,5,4,4,4,3,4,4,5,3,5,4,3,4,4,3,4],
    hdcp:[5,13,11,15,9,1,17,7,3,6,14,16,2,10,12,4,18,8],
    tees:[
      {name:'Black', rating:74.8, slope:140, par:72},
      {name:'Gold',  rating:72.6, slope:133, par:72},
      {name:'Blue',  rating:70.5, slope:126, par:72},
      {name:'White', rating:68.3, slope:118, par:72},
      {name:'Green', rating:65.8, slope:110, par:72}
    ]
  }
};
var TC=["#4ade80","#60a5fa","#f472b6","#fb923c","#a78bfa","#34d399","#38bdf8","#e879f9","#fbbf24","#f87171","#2dd4bf","#818cf8","#fb7185","#a3e635","#facc15","#22d3ee","#c084fc","#4ade80","#f97316","#e11d48","#06b6d4","#8b5cf6","#ec4899","#84cc16","#eab308","#0ea5e9","#7c3aed","#db2777","#65a30d","#ca8a04","#0284c7","#6d28d9","#be185d","#4d7c0f","#b45309","#0369a1","#5b21b6","#9d174d","#3f6212","#92400e"];

function uid(){return Math.random().toString(36).slice(2,9)}
function tc(id){return TC[id%TC.length]}

// Simple hash for PINs - not cryptographic but prevents casual impersonation
function hashPin(pin,name){
  var str=pin+'|'+name+'|golf2024';
  var h=0;
  for(var i=0;i<str.length;i++){h=((h<<5)-h)+str.charCodeAt(i);h=h&h;}
  return Math.abs(h).toString(36);
}

// Helper: get pars/hdcp for a round (falls back to global defaults)
function getPars(round){return (round&&round.pars&&round.pars.length===18)?round.pars:PARS;}
function getHdcp(round){return (round&&round.hdcp&&round.hdcp.length===18)?round.hdcp:HDCP;}

function netS(g,hcp,h,hdcpArr){if(!g)return 0;var hd=hdcpArr||HDCP;return Math.max(1,g-(hcp>=hd[h]?1:0))}

// ── WHS Playing Handicap ──────────────────────────────────────────────────────
// index = Handicap Index (stored on player)
// tee = {rating, slope, par}
// Returns playing handicap (integer strokes)
function calcPlayingHandicap(index,tee){
  if(!index&&index!==0)return 0;
  if(!tee||!tee.slope||!tee.rating||!tee.par)return Math.round(index);
  return Math.round(index*(tee.slope/113)+(tee.rating-tee.par));
}

// Get tee object for a player from a course preset or custom course
// courseName: string, teeName: string
function getTeeData(courseName,teeName){
  var preset=PRESET_COURSES[courseName];
  if(preset&&preset.tees&&teeName){
    return preset.tees.find(function(t){return t.name===teeName;})||null;
  }
  // Custom courses -- look up in S.courses
  var custom=Object.values(S.courses||{}).find(function(c){return c.name===courseName;});
  if(custom&&custom.tees&&teeName){
    return custom.tees.find(function(t){return t.name===teeName;})||null;
  }
  return null;
}

// Get playing handicap for a player in a round context
// player: {name, handicap (=index), tee (optional override)}
// round: {courseName, defaultTee, netScoring}
function playerPlayingHcp(player,round){
  if(!player)return 0;
  var idx=player.handicap||0;
  var teeName=player.tee||(round&&round.defaultTee)||null;
  var courseName=round&&round.courseName;
  var tee=courseName&&teeName?getTeeData(courseName,teeName):null;
  return tee?calcPlayingHandicap(idx,tee):Math.round(idx);
}
function gTot(p,holes){return p.scores.slice(0,holes||18).reduce(function(a,b){return a+b},0)}
function nTot(p,holes,hdcpArr){var hcp=p.playingHandicap!==undefined?p.playingHandicap:p.handicap;return p.scores.slice(0,holes||18).reduce(function(s,v,i){return s+(v?netS(v,hcp,i,hdcpArr):0)},0)}
function tPar(holes,parsArr){var pa=parsArr||PARS;return pa.slice(0,holes||18).reduce(function(a,b){return a+b},0)}

// Net for a range of holes (used for countback)
function nRange(p,from,to,hdcpArr){
  var hcp=p.playingHandicap!==undefined?p.playingHandicap:p.handicap;
  var total=0;
  for(var i=from;i<to;i++){if(p.scores[i])total+=netS(p.scores[i],hcp,i,hdcpArr);}
  return total;
}

// Countback: compare last 6, last 3, last 1 hole net scores
function countback(a,b,holes,hdcpArr){
  var h=holes||18;
  var ranges=[[h-6,h],[h-3,h],[h-1,h]];
  for(var i=0;i<ranges.length;i++){
    var from=Math.max(0,ranges[i][0]),to=ranges[i][1];
    var na=nRange(a,from,to,hdcpArr),nb=nRange(b,from,to,hdcpArr);
    if(na!==nb)return na-nb;
  }
  return 0;
}

function bbNet(players,tid,holes,parsArr,hdcpArr){
  var tp=players.filter(function(p){return p.teamId===tid&&!p.absent});
  if(!tp.length)return 0;
  var pa=parsArr||PARS;
  return pa.slice(0,holes||18).reduce(function(tot,_,h){
    var nets=tp.map(function(p){return p.scores[h]?netS(p.scores[h],p.handicap,h,hdcpArr):999});
    var best=Math.min.apply(null,nets);
    return tot+(best<999?best:0);
  },0);
}

// Best ball countback: compare last 6/3/1 holes of best ball net
function bbRange(players,tid,from,to,hdcpArr){
  var tp=players.filter(function(p){return p.teamId===tid&&!p.absent});
  if(!tp.length)return 0;
  var total=0;
  for(var h=from;h<to;h++){
    var nets=tp.map(function(p){return p.scores[h]?netS(p.scores[h],p.handicap,h,hdcpArr):999});
    var best=Math.min.apply(null,nets);
    total+=best<999?best:0;
  }
  return total;
}

function bbCountback(playersA,tidA,playersB,tidB,holes,hdcpArr){
  var h=holes||18;
  var ranges=[[h-6,h],[h-3,h],[h-1,h]];
  for(var i=0;i<ranges.length;i++){
    var from=Math.max(0,ranges[i][0]),to=ranges[i][1];
    var na=bbRange(playersA,tidA,from,to,hdcpArr),nb=bbRange(playersB,tidB,from,to,hdcpArr);
    if(na!==nb)return na-nb;
  }
  return 0;
}

function allocPts(teamScores,soloIds,allPlayers,holes,hdcpArr){
  var pts={};
  teamScores.forEach(function(t){pts[t.teamId]=1}); // participation point for all

  // Only rank teams that actually submitted scores (score > 0)
  var competing=teamScores.filter(function(t){
    var tp=allPlayers.filter(function(p){return p.teamId===t.teamId&&!p.absent});
    var hasScores=tp.some(function(p){return p.scores.some(function(s){return s>0})});
    return hasScores;
  });
  var noShows=teamScores.filter(function(t){
    var tp=allPlayers.filter(function(p){return p.teamId===t.teamId&&!p.absent});
    var hasScores=tp.some(function(p){return p.scores.some(function(s){return s>0})});
    return !hasScores;
  });
  // No-shows get participation only (already set to 1 above)
  noShows.forEach(function(t){pts[t.teamId]=0}); // no participation if didn't play

  // Sort competing teams with countback tiebreaker
  var sorted=competing.slice().sort(function(a,b){
    if(a.score!==b.score)return a.score-b.score;
    return bbCountback(allPlayers,a.teamId,allPlayers,b.teamId,holes,hdcpArr);
  });
  var awards=[5,4,3],i=0;
  while(i<sorted.length){
    var score=sorted[i].score,j=i;
    while(j<sorted.length&&sorted[j].score===score&&bbCountback(allPlayers,sorted[i].teamId,allPlayers,sorted[j].teamId,holes,hdcpArr)===0)j++;
    if(i<awards.length){
      var award=awards[i];
      sorted.slice(i,j).forEach(function(t){
        var solo=soloIds&&soloIds.indexOf(t.teamId)>=0;
        pts[t.teamId]=(pts[t.teamId]||0)+(solo?award*2:award);
      });
    }
    i=j;
  }
  return pts;
}

function calcSkins(players,holes,hdcpArr){
  var cnt={},detail=[];
  players.forEach(function(p){cnt[p.name]=0});
  for(var h=0;h<(holes||18);h++){
    var sc=players.filter(function(p){return p.scores[h]>0}).map(function(p){return{name:p.name,g:p.scores[h],n:netS(p.scores[h],p.handicap,h,hdcpArr)}});
    if(sc.length<2){detail.push({hole:h+1,winner:null,how:null,score:null});continue}
    var mg=Math.min.apply(null,sc.map(function(s){return s.g}));
    var gw=sc.filter(function(s){return s.g===mg});
    if(gw.length===1){cnt[gw[0].name]++;detail.push({hole:h+1,winner:gw[0].name,how:'gross',score:gw[0].g});continue}
    var mn=Math.min.apply(null,sc.map(function(s){return s.n}));
    var nw=sc.filter(function(s){return s.n===mn});
    if(nw.length===1){cnt[nw[0].name]++;detail.push({hole:h+1,winner:nw[0].name,how:'net',score:nw[0].n});continue}
    detail.push({hole:h+1,winner:null,how:null,score:null});
  }
  return{cnt:cnt,detail:detail};
}

// ── Skins for teams (events) ─────────────────────────────────────────────────
// teams: [{id, name, scores[], avgHandicap}], returns {cnt:{teamId:skins}, detail:[]}
function calcSkinsTeams(teams,holes,pars,hdcp,useNet){
  var cnt={},detail=[];
  teams.forEach(function(t){cnt[t.id]=0});
  for(var h=0;h<(holes||18);h++){
    var sc=teams.filter(function(t){return t.scores[h]>0}).map(function(t){
      var gross=t.scores[h];
      var net=useNet?Math.max(1,gross-(t.avgHandicap>=hdcp[h]?1:0)):gross;
      return{id:t.id,name:t.name,gross:gross,net:net};
    });
    if(sc.length<2){detail.push({hole:h+1,winner:null,how:null,score:null});continue}
    var useScore=useNet?'net':'gross';
    var mn=Math.min.apply(null,sc.map(function(s){return s[useScore]}));
    var winners=sc.filter(function(s){return s[useScore]===mn});
    if(winners.length===1){cnt[winners[0].id]++;detail.push({hole:h+1,winner:winners[0].name,how:useNet?'net':'gross',score:mn});}
    else{detail.push({hole:h+1,winner:null,how:'tie',score:mn});}
  }
  return{cnt:cnt,detail:detail};
}

// Group repetitive items: collapse sequential same-type items
function groupFeedItems(items){
  var grouped=[];
  items.forEach(function(item,i){
    var prev=grouped[grouped.length-1];
    // Group consecutive score_posted from same round within 5 minutes
    if(prev&&prev.type===item.type&&item.type==='score_posted'
      &&prev.contextId===item.contextId
      &&(item.ts-prev._lastTs)<300000){
      prev._count=(prev._count||1)+1;
      prev._lastTs=item.ts;
      prev.message=prev._actors?
        (prev._actors.length<3?prev._actors.join(', ')+' and '+item.actor+' posted scores':
        prev._actors[0]+' and '+(prev._count)+' others posted scores'):
        prev.message;
      if(!prev._actors)prev._actors=[prev.actor];
      if(prev._actors.indexOf(item.actor)<0)prev._actors.push(item.actor);
    } else {
      var g=Object.assign({},item,{_lastTs:item.ts,_count:1});
      grouped.push(g);
    }
  });
  return grouped;
}

function renderFeedTab(contextType,contextId,root){

function isActiveNow(presenceEntry){
  if(!presenceEntry)return false;
  var lastSeen=presenceEntry.lastSeen||presenceEntry; // backwards compat
  return (Date.now()-lastSeen)<ACTIVE_THRESHOLD;
}

function presenceBadge(presenceEntry){
  var lastSeen=presenceEntry&&presenceEntry.lastSeen?presenceEntry.lastSeen:presenceEntry;
  if(!lastSeen)return{icon:'⏳',label:'Not yet logged in',color:'var(--dim)'};
  var age=Date.now()-lastSeen;
  if(age<ACTIVE_THRESHOLD)return{icon:'🟢',label:'Active now',color:'#4ade80'};
  if(age<86400000)return{icon:'👋',label:'Active today',color:'var(--gold)'};
  if(age<604800000)return{icon:'👋',label:'Seen '+Math.floor(age/86400000)+'d ago',color:'var(--dim)'};
  return{icon:'⏳',label:'Not yet logged in',color:'var(--dimmer)'};
}

// ── Vegas calculation ─────────────────────────────────────────────────────────
// teams: [{id, name, scores[], avgHandicap}]
// Returns {detail:[{hole,aScore,bScore,aFlipped,bFlipped,diff,winner}], totals:{teamId:points}, winnings:{teamName:$}}
function calcVegas(teams,holes,pars,hdcp,dollarPerPoint,useNet){
  if(teams.length!==2)return null;
  var a=teams[0],b=teams[1];
  var detail=[];
  var pts={};pts[a.id]=0;pts[b.id]=0;

  function netHole(t,hi){
    var g=t.scores[hi]||0;
    if(!g)return 0;
    return useNet?Math.max(1,g-(t.avgHandicap>=(hdcp[hi]||99)?1:0)):g;
  }

  function vegaNum(s1,s2){
    // lower score goes first to form the two-digit number
    var lo=Math.min(s1,s2),hi2=Math.max(s1,s2);
    return lo*10+hi2;
  }

  for(var hi=0;hi<holes;hi++){
    var aScores=a.players.map(function(pname){
      var pScores=(a.playerScores&&a.playerScores[pname])||a.scores;
      var pObj=(a._evPlayers||[]).find(function(p){return p.name===pname;});
      var pHcp=pObj?pObj.handicap:(a.avgHandicap||18);
      return netHole({scores:pScores,avgHandicap:pHcp},hi);
    }).filter(function(s){return s>0});
    var bScores=b.players.map(function(pname){
      var pScores=(b.playerScores&&b.playerScores[pname])||b.scores;
      var pObj=(b._evPlayers||[]).find(function(p){return p.name===pname;});
      var pHcp=pObj?pObj.handicap:(b.avgHandicap||18);
      return netHole({scores:pScores,avgHandicap:pHcp},hi);
    }).filter(function(s){return s>0});

    // For 2-player teams use individual scores; for 1-player (singles) use the single score twice
    var aS1=aScores[0]||0,aS2=aScores[1]||aS1;
    var bS1=bScores[0]||0,bS2=bScores[1]||bS1;
    if(!aS1||!bS1){detail.push({hole:hi+1,skip:true});continue;}

    var par=pars[hi]||4;
    // Gross scores for birdie determination (stroke affects number only, not birdie trigger)
    var aGross1=a.players[0]?(a.playerScores&&a.playerScores[a.players[0]]?a.playerScores[a.players[0]][hi]:a.scores[hi])||0:0;
    var aGross2=a.players[1]?(a.playerScores&&a.playerScores[a.players[1]]?a.playerScores[a.players[1]][hi]:a.scores[hi])||0:0;
    var bGross1=b.players[0]?(b.playerScores&&b.playerScores[b.players[0]]?b.playerScores[b.players[0]][hi]:b.scores[hi])||0:0;
    var bGross2=b.players[1]?(b.playerScores&&b.playerScores[b.players[1]]?b.playerScores[b.players[1]][hi]:b.scores[hi])||0:0;
    var aBirdie=(aGross1>0&&aGross1<par)||(aGross2>0&&aGross2<par);
    var bBirdie=(bGross1>0&&bGross1<par)||(bGross2>0&&bGross2<par);

    var aNum=vegaNum(aS1,aS2);
    var bNum=vegaNum(bS1,bS2);

    // If one team has a birdie and the other doesn't, flip the opponent's number
    var aFlipped=false,bFlipped=false;
    if(aBirdie&&!bBirdie){
      // flip b: swap digits
      var bLo=bNum%10,bHi2=Math.floor(bNum/10);
      bNum=bLo*10+bHi2;bFlipped=true;
    } else if(bBirdie&&!aBirdie){
      var aLo=aNum%10,aHi2=Math.floor(aNum/10);
      aNum=aLo*10+aHi2;aFlipped=true;
    }
    // both birdie -- cancel out, no flip

    var diff=Math.abs(aNum-bNum);
    var winner=aNum<bNum?a.id:(bNum<aNum?b.id:null);
    if(winner){pts[winner]=(pts[winner]||0)+diff;}
    detail.push({hole:hi+1,aNum:aNum,bNum:bNum,aFlipped:aFlipped,bFlipped:bFlipped,diff:diff,winner:winner,aBirdie:aBirdie,bBirdie:bBirdie});
  }

  var totalPts=pts[a.id]+pts[b.id];
  var winnings={};
  if(totalPts>0){
    [a,b].forEach(function(t){
      if(pts[t.id]>0)winnings[t.name]=pts[t.id]*dollarPerPoint;
    });
  }
  return{detail:detail,totals:pts,winnings:winnings,teamA:a,teamB:b};
}

// ── Nassau calculation ─────────────────────────────────────────────────────────
// Works for both individual players and teams
// Returns {front, back, overall} each being {winner, score, tied}
// entries: [{id, name, score(fn)}] where score(h) returns the score for hole h
function calcNassau(entries,holes,pars,hdcp,useNet){
  var hs=holes||18;
  var front=Math.floor(hs/2),back=hs-front;

  // Sum scores for front, back, total
  var totals=entries.map(function(e){
    var f=0,b=0;
    for(var h=0;h<front;h++)f+=e.holeScore(h);
    for(var h=front;h<hs;h++)b+=e.holeScore(h);
    return{id:e.id,name:e.name,front:f,back:b,total:f+b};
  }).filter(function(e){return e.total>0});

  function winner(arr,field,lowerWins){
    if(!arr.length)return{winner:null,score:null,tied:false};
    var scores=arr.map(function(e){return e[field]});
    var best=lowerWins?Math.min.apply(null,scores):Math.max.apply(null,scores);
    var winners=arr.filter(function(e){return e[field]===best});
    return{winner:winners.length===1?winners[0].name:null,score:best,tied:winners.length>1,winners:winners.map(function(e){return e.name})};
  }

  return{
    front:winner(totals,'front',true),
    back:winner(totals,'back',true),
    overall:winner(totals,'total',true)
  };
}

// Nassau for stableford (higher is better)
function calcNassauStableford(entries,holes,pars,hdcp){
  var hs=holes||18;
  var front=Math.floor(hs/2);
  var totals=entries.map(function(e){
    var f=0,b=0;
    for(var h=0;h<front;h++)f+=e.holeScore(h);
    for(var h=front;h<hs;h++)b+=e.holeScore(h);
    return{id:e.id,name:e.name,front:f,back:b,total:f+b};
  }).filter(function(e){return e.total>0});
  function winner(arr,field){
    if(!arr.length)return{winner:null,score:null,tied:false};
    var best=Math.max.apply(null,arr.map(function(e){return e[field]}));
    var winners=arr.filter(function(e){return e[field]===best});
    return{winner:winners.length===1?winners[0].name:null,score:best,tied:winners.length>1,winners:winners.map(function(e){return e.name})};
  }
  return{front:winner(totals,'front'),back:winner(totals,'back'),overall:winner(totals,'total')};
}

var BOT=[{n:1,b:1},{n:2,b:1},{n:3,b:1},{n:4,b:1},{n:5,b:3},{n:6,b:3},{n:7,b:4},{n:8,b:4},{n:9,b:5},{n:10,b:5},{n:11,b:6},{n:12,b:6},{n:13,b:7},{n:14,b:7},{n:15,b:8},{n:16,b:8}];
function calcHcp(name,rounds){
  var diffs=[];
  rounds.slice().reverse().forEach(function(r){
    if(!r.players)return;
    var p=r.players.find(function(x){return x.name===name});
    if(!p)return;
    var h=r.holes||18,g=p.scores.slice(0,h).reduce(function(a,b){return a+b},0);
    if(!g)return;
    var rPars=getPars(r);
    diffs.push(g-rPars.slice(0,h).reduce(function(a,b){return a+b},0));
  });
  if(!diffs.length)return null;
  var n=diffs.length,e=n>=17?{b:9}:(BOT.find(function(x){return x.n===n})||BOT[BOT.length-1]);
  var avg=diffs.slice().sort(function(a,b){return a-b}).slice(0,e.b).reduce(function(a,b){return a+b},0)/e.b;
  return Math.max(0,Math.round(avg));
}

var listeners = {};

  if (listeners[k]) return; // already listening
  initFirebase().then(function(){

function checkAutoFinalize(){
  var live=S.live;
  if(!live||live.finalized)return;
  var submitted=Object.keys(live.teamSubmissions||{});
  var allTeams=[];
  var seen={};
  (live.players||[]).forEach(function(p){if(!seen[p.teamId]){seen[p.teamId]=1;allTeams.push(String(p.teamId))}});
  if(allTeams.length>0&&allTeams.every(function(t){return submitted.indexOf(t)>=0})){
    finalize(live);
  }
}

function finalize(round){
  var players=round.players,holes=round.holes||18;
  var rPars=getPars(round),rHdcp=getHdcp(round);
  var seen={};var teamIds=[];
  players.forEach(function(p){if(!seen[p.teamId]){seen[p.teamId]=1;teamIds.push(p.teamId)}});
  var soloIds=(round.soloPlayers||[]).map(function(t){return parseInt(t)});
  var activePlayers=players.filter(function(p){return !p.absent});
  var teamScores=teamIds.map(function(t){return{teamId:t,score:bbNet(activePlayers,t,holes,rPars,rHdcp)}});
  var teamPoints=allocPts(teamScores,soloIds,activePlayers,holes,rHdcp);
  var playerPoints={};
  activePlayers.forEach(function(p){playerPoints[p.name]=teamPoints[p.teamId]||0});
  var skins=calcSkins(activePlayers,holes,rHdcp);

  // ── Calculate pot winnings ─────────────────────────────────────────────────
  var contests=round.contests||{skinsPot:250,ctpHole1:null,ctpHole2:null,ldHole:null,ctpWinner1:null,ctpWinner2:null,ldWinner:null};
  var potWinnings={}; // playerName -> amount won
  activePlayers.forEach(function(p){potWinnings[p.name]=0});

  // Skins pot - split proportionally
  var totalSkins=Object.values(skins.cnt).reduce(function(a,b){return a+b},0);
  var skinsPotRollover=0;
  if(totalSkins>0){
    Object.keys(skins.cnt).forEach(function(name){
      if(skins.cnt[name]>0){
        potWinnings[name]=(potWinnings[name]||0)+Math.round((skins.cnt[name]/totalSkins)*contests.skinsPot*100)/100;
      }
    });
  } else {
    skinsPotRollover=contests.skinsPot; // full pot rolls over
  }

  // CTP 1 ($50)
  if(contests.ctpWinner1){potWinnings[contests.ctpWinner1]=(potWinnings[contests.ctpWinner1]||0)+50}
  // CTP 2 ($50)
  if(contests.ctpWinner2){potWinnings[contests.ctpWinner2]=(potWinnings[contests.ctpWinner2]||0)+50}
  // Longest Drive ($50)
  if(contests.ldWinner){potWinnings[contests.ldWinner]=(potWinnings[contests.ldWinner]||0)+50}

  var finished=Object.assign({},round,{finished:true,soloTeamIds:soloIds,pointsAwarded:teamPoints,playerPoints:playerPoints,teamScores:teamScores,skinCount:skins.cnt,skinDetail:skins.detail,potWinnings:potWinnings,skinsPotRollover:skinsPotRollover});
  var newRounds=[finished].concat(S.rounds.filter(function(r){return r.id!==finished.id}));
  var lg=getLeague();
  if(lg&&round.leagueRound&&round.leagueId===lg.id){
    var existing=lg.playerStandings||{};
    var newPs=Object.assign({},existing);
    activePlayers.forEach(function(p){
      var pts=playerPoints[p.name]||0,sk=skins.cnt[p.name]||0;
      var won=potWinnings[p.name]||0;
      var combined=[finished].concat(newRounds.filter(function(r){return r.id!==finished.id}));
      var hcp=calcHcp(p.name,combined);
      var ex=existing[p.name]||{points:0,weeksPlayed:0,skins:0,roundsPlayed:0,winnings:0};
      newPs[p.name]={name:p.name,teamId:p.teamId,points:ex.points+pts,weeksPlayed:ex.weeksPlayed+1,handicap:hcp!==null?hcp:p.handicap,roundsPlayed:ex.roundsPlayed+1,skins:ex.skins+sk,winnings:(ex.winnings||0)+won};
    });
    var newLg=Object.assign({},lg,{
      weeks:(lg.weeks||[]).concat({roundId:finished.id,date:finished.date,name:finished.name,pointsAwarded:teamPoints,teamScores:teamScores,potWinnings:potWinnings,skinsPot:contests.skinsPot,skinsPotRollover:skinsPotRollover}),
      teams:lg.teams.map(function(t){
        // Sum points for all players on this team (handles solo doubles and multi-player teams)
        var teamPlayerPts=activePlayers.filter(function(p){return p.teamId===t.id}).reduce(function(sum,p){return sum+(playerPoints[p.name]||0)},0);
        return Object.assign({},t,{points:(t.points||0)+teamPlayerPts,weeksPlayed:(t.weeksPlayed||0)+1});
      }),
      playerStandings:newPs,
      skinsPotRollover:skinsPotRollover // carry forward for next week
    });
    pushLeague(newLg).then(function(){});
  }
  // Write activity feed
  if(lg&&round.leagueRound){
    writeFeedItem('league',lg.id,lg.name,'round_complete','',
      'Round complete at '+(round.courseName||'the course')+' 🏁');
    // Top scorer this week
    var topPts=Object.entries(playerPoints||{}).sort(function(a,b){return b[1]-a[1]})[0];
    if(topPts&&topPts[1]>0){
      writeFeedItem('league',lg.id,lg.name,'standings_change',topPts[0],
        topPts[0]+' leads this week with '+topPts[1]+' pts 📈');
    }
    // Skins winner
    if(totalSkins>0){
      Object.keys(skins.cnt).forEach(function(name){
        if(skins.cnt[name]>0){
          writeFeedItem('league',lg.id,lg.name,'skins_won',name,
            name+' won '+skins.cnt[name]+' skin'+(skins.cnt[name]>1?'s':'')+' 💰');
        }
      });
    }
  }
  Promise.all([pushRounds(newRounds),pushLive(Object.assign({},round,{finalized:true}))]).then(function(){
    setState({rounds:newRounds,summRound:finished,screen:'summary'});
  });
}

// ── DOM helpers ───────────────────────────────────────────────────────────────
function h(tag,attrs,children){
  var el=document.createElement(tag);
  if(attrs)Object.keys(attrs).forEach(function(k){
    if(k==='style'&&typeof attrs[k]==='object'){Object.assign(el.style,attrs[k])}
    else if(k.startsWith('on'))el.addEventListener(k.slice(2).toLowerCase(),attrs[k])
    else if(k==='className')el.className=attrs[k]
    else if(k==='disabled')el.disabled=attrs[k]
    else el.setAttribute(k,attrs[k])
  });
  if(children){
    (Array.isArray(children)?children:[children]).forEach(function(c){
      if(c==null||c===false)return;
      if(typeof c==='string'||typeof c==='number')el.appendChild(document.createTextNode(String(c)));
      else el.appendChild(c);
    })
  }
  return el;
}
function btn(cls,txt,onclick,disabled){var b=h('button',{className:'btn '+cls,onClick:onclick,disabled:!!disabled});b.textContent=txt;return b}
function gap(children){return h('div',{className:'gap'},children)}
function card(title,children){
  var c=h('div',{className:'card'});
  if(title){var t=document.createElement('div');t.className='ct';t.textContent=title;c.appendChild(t)}
  if(children)(Array.isArray(children)?children:[children]).forEach(function(child){if(child)c.appendChild(child)});
  return c;
}
function setHdr(title,sub){document.getElementById('hdr-title').textContent=title;document.getElementById('hdr-sub').textContent=sub||''}
function myTeamPlayers(){
  if(!S.live)return[];
  if(S.adminEnteringForTeam!=null)return (S.live.players||[]).filter(function(p){return p.teamId===S.adminEnteringForTeam});
  var mp=(S.live.players||[]).find(function(p){return p.name===S.myName});
  if(!mp)return[];
  return (S.live.players||[]).filter(function(p){return p.teamId===mp.teamId});
}
function myTeamId(){if(S.adminEnteringForTeam!=null)return S.adminEnteringForTeam;var mp=S.live?(S.live.players||[]).find(function(p){return p.name===S.myName}):null;return mp?mp.teamId:null}
function mySubmitted(){var tid=myTeamId();return S.live&&tid!==null?!!(S.live.teamSubmissions&&S.live.teamSubmissions[String(tid)]):false}
// Returns the hole to resume scoring at -- first unscored hole, or last hole if all done
function resumeHole(playerNames,holes){
  holes=holes||18;
  if(!S.localScores||!playerNames||!playerNames.length)return 0;
  var firstName=playerNames[0];
  var sc=S.localScores[firstName]||[];
  for(var i=0;i<holes;i++){if(!sc[i])return i;}
  return holes-1;
}

// ── PIN keypad ────────────────────────────────────────────────────────────────
function pinKeypad(onComplete){
  var entered='';
  var wrap=h('div',null);

  var dots=h('div',{className:'pin-display'});
  for(var i=0;i<4;i++){var d=document.createElement('div');d.className='pin-dot';d.id='pin-dot-'+i;dots.appendChild(d)}
  wrap.appendChild(dots);

  function update(){
    for(var i=0;i<4;i++){document.getElementById('pin-dot-'+i).className='pin-dot'+(i<entered.length?' filled':'')}
    if(entered.length===4)onComplete(entered);
  }

  var grid=h('div',{className:'pin-grid'});
  var nums=['1','2','3','4','5','6','7','8','9','','0','⌫'];
  nums.forEach(function(n){
    var b=document.createElement('button');
    b.className='pin-btn';b.textContent=n;
    if(!n)b.style.visibility='hidden';
    b.addEventListener('click',function(){
      if(n==='⌫'){if(entered.length>0){entered=entered.slice(0,-1);update()}}
      else if(n&&entered.length<4){entered+=n;update()}
    });
    grid.appendChild(b);
  });
  wrap.appendChild(grid);
  return wrap;
}

function screenLeagueLogin(){
  var root=h('div',{className:'screen',style:{paddingTop:'20px'}});

    h('div',{style:{fontSize:'24px',color:'var(--gold)',fontWeight:'700'}},'League Sign In'),

  ]));

  var step=0,selLeagueId='',selName='';

  var stepWrap=h('div',{className:'card'});

  function buildStep(){
    stepWrap.innerHTML='';
    if(step===0){
      var ct=h('div',{className:'ct'});ct.textContent='Select Your League';stepWrap.appendChild(ct);
      var leagues=Object.values(S.leagues||{});
      if(!leagues.length){
        var nd=h('div',{style:{color:'var(--dim)',fontSize:'13px',padding:'8px 0'}});nd.textContent='No leagues set up yet.';stepWrap.appendChild(nd);
      }

      });
      stepWrap.appendChild(h('div',{style:{height:'8px'}}));
      stepWrap.appendChild(btn('bg','← Back',function(){setState({screen:'login'})}));
    } else if(step===1){
      var ct2=h('div',{className:'ct'});ct2.textContent='Select Your Name';stepWrap.appendChild(ct2);
      var lg=S.leagues[selLeagueId];
      var ps=lg?Object.values(lg.playerStandings||{}).sort(function(a,b){return a.name.localeCompare(b.name)}):[];
      if(S.live&&S.live.leagueId===selLeagueId)(S.live.players||[]).forEach(function(p){if(!ps.find(function(x){return x.name===p.name}))ps.push(p)});
      var sel=h('select',{className:'inp sel',style:{height:'52px',fontSize:'16px',marginBottom:'12px'}});
      var opt0=document.createElement('option');opt0.value='';opt0.textContent='Select your name';sel.appendChild(opt0);
      ps.forEach(function(p){var o=document.createElement('option');o.value=p.name;o.textContent=p.name;sel.appendChild(o)});
      var nextBtn=btn('bp','Next →',function(){if(!sel.value)return;selName=sel.value;step=2;buildStep()});
      nextBtn.disabled=true;
      sel.addEventListener('change',function(){nextBtn.disabled=!sel.value;selName=sel.value});
      stepWrap.appendChild(sel);stepWrap.appendChild(nextBtn);
      stepWrap.appendChild(h('div',{style:{height:'8px'}}));
      stepWrap.appendChild(btn('bg','← Back',function(){step=0;buildStep()}));
    } else if(step===2){
      var ct3=h('div',{className:'ct'});ct3.textContent='Enter Your PIN';stepWrap.appendChild(ct3);
      var sub2=h('div',{style:{fontSize:'13px',color:'var(--dim)',marginBottom:'8px',textAlign:'center'}});sub2.textContent='Signing in as: '+selName;stepWrap.appendChild(sub2);
      var errDiv=h('div',{className:'err hidden'});stepWrap.appendChild(errDiv);
      var kp=pinKeypad(function(pin){
        var lg2=S.leagues[selLeagueId];
        var player=lg2?(lg2.playerStandings||{})[selName]:null;
        if(!player&&S.live){player=(S.live.players||[]).find(function(p){return p.name===selName})}
        if(!player){errDiv.textContent='Player not found.';errDiv.classList.remove('hidden');return}
        if(!player.pinHash){doLogin(selName,selLeagueId,false);return}
        if(hashPin(pin,selName)===player.pinHash){doLogin(selName,selLeagueId,false);}
        else{errDiv.textContent='Incorrect PIN.';errDiv.classList.remove('hidden');setTimeout(function(){buildStep()},800);}
      });
      stepWrap.appendChild(kp);
      stepWrap.appendChild(h('div',{style:{height:'8px'}}));
      stepWrap.appendChild(btn('bg','← Back',function(){step=1;buildStep()}));
    }
  }
  buildStep();
  root.appendChild(stepWrap);
  return root;
}

  // ── Step 3: Generating ─────────────────────────────────────────────────────
  function renderGenerating(){
    var wrap=h('div',{style:{textAlign:'center',padding:'60px 20px'}});
    var spinner=h('div',{style:{fontSize:'48px',marginBottom:'20px',display:'inline-block',animation:'spin 2s linear infinite'}});spinner.textContent='⛳';
    var title=h('div',{style:{fontSize:'20px',fontWeight:'700',color:'var(--gold)',marginBottom:'8px'}});title.textContent='Building your trip...';

    var msgEl=h('div',{style:{fontSize:'13px',color:'var(--dim)'}});msgEl.textContent=msgs[0];
    var mi=0;root._msgTimer=setInterval(function(){mi=(mi+1)%msgs.length;msgEl.textContent=msgs[mi];},1800);
    wrap.appendChild(spinner);wrap.appendChild(title);wrap.appendChild(msgEl);
    root.appendChild(wrap);
  }

  // ── AI call ─────────────────────────────────────────────────────────────────
  function generateItinerary(){
    var dest=planState.destination;
    var destName=dest.id==='custom'?planState.customDest:dest.name;
    var courseList=planState.selectedCourses.length?planState.selectedCourses.join(', '):'no specific courses -- recommend the best options for this destination';

    var promptLines=[
      'You are an expert golf travel planner. Create a detailed golf trip itinerary.',
      '',
      'Trip details:',
      '- Destination: '+destName,
      '- Must-play courses: '+courseList,
      '- Golfers: '+planState.golfers,
      '- Nights: '+planState.nights,
      '- Budget: '+planState.budget,
      planState.dates?'- Dates: '+planState.dates:'',
      planState.notes?'- Notes: '+planState.notes:'',
      '',
      'Build the itinerary AROUND the must-play courses. Schedule them on specific days.',
      'Fill remaining days with complementary courses and activities.',
      '',
      'Respond ONLY with a JSON object (no markdown, no backticks):',
      '{',
      '  "tripName": "string",',
      '  "destination": "string",',
      '  "summary": "string (2-3 sentences, aspirational)",',
      '  "highlights": ["string","string","string"],',
      '  "days": [{"day":1,"title":"string","morning":"string","afternoon":"string","evening":"string","course":"string or null"}],',
      '  "courses": [{"name":"string","notes":"string","mustPlay":true}],',
      '  "accommodation": {"suggestion":"string","notes":"string"},',
      '  "logistics": ["string","string"],',
      '  "estimatedCostPerPerson": "string",',
      '  "conciergeNote": "string"',
      '}'
    ];

    fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        model:'claude-sonnet-4-20250514',
        max_tokens:1000,
        messages:[{role:'user',content:promptLines.filter(Boolean).join('\n')}]
      })
    }).then(function(r){return r.json();}).then(function(data){
      if(root._msgTimer)clearInterval(root._msgTimer);
      var text=data.content&&data.content[0]&&data.content[0].text;
      if(!text){planState.step='destination';renderPlanner();return;}
      try{
        planState.itinerary=JSON.parse(text.replace(/```json|```/g,'').trim());
        planState.step='result';renderPlanner();
      } catch(e){planState.step='destination';renderPlanner();}
    }).catch(function(err){
      if(root._msgTimer)clearInterval(root._msgTimer);
      root.innerHTML='';
      var errWrap=h('div',{style:{textAlign:'center',padding:'40px 20px'}});
      var errIcon=h('div',{style:{fontSize:'40px',marginBottom:'12px'}});errIcon.textContent='⚠️';
      var errTitle=h('div',{style:{fontSize:'16px',fontWeight:'700',color:'#f97316',marginBottom:'8px'}});errTitle.textContent='Could not build itinerary';
      var errMsg=h('div',{style:{fontSize:'12px',color:'var(--dim)',lineHeight:'1.6',marginBottom:'16px'}});
      errMsg.textContent='This feature requires the app to be hosted online (not opened as a local file). Deploy to golfconnectionusa.com and try again.';
      var errBack=btn('bg','← Back',function(){planState.step='destination';renderPlanner();});
      errWrap.appendChild(errIcon);errWrap.appendChild(errTitle);errWrap.appendChild(errMsg);errWrap.appendChild(errBack);
      root.appendChild(errWrap);
    });
  }

// ── Scoring ───────────────────────────────────────────────────────────────────
// ── Global scoring helpers ────────────────────────────────────────────────────
function haptic(pattern){if(navigator.vibrate)navigator.vibrate(pattern||8);}

function scoreLabel(val,par2,lbl){
  lbl.innerHTML='';lbl.style.color='';
  if(!val)return;
  var diff=val-par2;
  if(diff<=-2){lbl.textContent='Eagle';lbl.style.color='var(--gold)';}
  else if(diff===-1){lbl.textContent='Birdie';lbl.style.color='var(--gold)';}
  else if(diff===0){lbl.textContent='Par';lbl.style.color='#6ee7b7';}
  else if(diff===1){lbl.textContent='Bogey';lbl.style.color='#f87171';}
  else{lbl.textContent='+'+diff;lbl.style.color='#f87171';}
}

function buildStepper(initVal,parVal,onChange){
  var val=initVal||parVal;
  var wrap2=h('div',{style:{display:'flex',alignItems:'center',gap:'0',marginBottom:'4px'}});
  var minusBtn=h('button',{style:{
    width:'48px',height:'46px',border:'none',borderRadius:'8px 0 0 8px',
    background:'rgba(255,255,255,.05)',color:'var(--cream)',fontSize:'22px',fontWeight:'300',
    cursor:'pointer',flexShrink:'0',transition:'background .1s'
  }});minusBtn.textContent='−';
  var scoreDisplay=h('div',{style:{
    flex:'1',height:'46px',background:'rgba(0,0,0,.3)',
    border:'2px solid rgba(201,168,76,.22)',borderLeft:'none',borderRight:'none',
    color:'var(--cream)',fontSize:'30px',fontFamily:'serif',textAlign:'center',
    lineHeight:'46px',cursor:'pointer',transition:'border-color .15s',userSelect:'none'
  }});
  scoreDisplay.textContent=val||'-';
  var plusBtn=h('button',{style:{
    width:'48px',height:'46px',border:'none',borderRadius:'0 8px 8px 0',
    background:'rgba(255,255,255,.05)',color:'var(--cream)',fontSize:'22px',fontWeight:'300',
    cursor:'pointer',flexShrink:'0',transition:'background .1s'
  }});plusBtn.textContent='+';
  var lbl2=h('div',{style:{textAlign:'center',fontSize:'11px',fontWeight:'700',marginTop:'2px',height:'14px'}});
  scoreLabel(val,parVal,lbl2);

    saveErr.classList.add('hidden');
    saveBtn2.disabled=true;saveBtn2.textContent='Saving...';
    var newCourse={id:uid(),name:newName.trim(),pars:newPars.slice(0,18),hdcp:newHdcp.slice(0,18),tees:newTees.slice(),created:new Date().toISOString()};
    pushCourse(newCourse).then(function(){setState({screen:'courseManager'})});
  });

  addCard.appendChild(h('label',{className:'lbl'},'Course Name'));
  addCard.appendChild(nameInp2);
  addCard.appendChild(h('label',{className:'lbl'},'Pars (holes 1-18, comma separated)'));
  addCard.appendChild(h('div',{style:{fontSize:'11px',color:'var(--dim)',marginBottom:'4px'}},'e.g. 4,3,5,4,4,3,5,4,4,4,3,5,4,4,3,5,4,4'));
  addCard.appendChild(parsInp2);
  addCard.appendChild(parsTotal);
  addCard.appendChild(h('label',{className:'lbl'},'Stroke Index (holes 1-18, comma separated)'));
  addCard.appendChild(h('div',{style:{fontSize:'11px',color:'var(--dim)',marginBottom:'4px'}},'1 = hardest, 18 = easiest'));
  addCard.appendChild(hdcpInp2);
  addCard.appendChild(teeSection);
  addCard.appendChild(h('div',{style:{height:'8px'}}));

// ── League screen ─────────────────────────────────────────────────────────────
function screenLeague(){
  var lg=getLeague();
  if(!lg){
    setHdr('League','Standings');

      var nd=h('div',{style:{textAlign:'center',padding:'30px 0',color:'var(--dim)'}});nd.textContent='No league selected.';root.appendChild(nd);

    return root;
  }
  setHdr(lg.name,'Season Standings');
  var root=h('div',{className:'screen'});
  var headerRow=h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'flex-end'}});
  var ta=h('div');
  var sl=h('div',{style:{fontSize:'11px',color:'var(--dim)',letterSpacing:'2px',textTransform:'uppercase'}});sl.textContent='Season';
  var ln=h('div',{style:{fontSize:'22px',color:'var(--gold)',fontWeight:'700'}});ln.textContent=lg.name;
  ta.appendChild(sl);ta.appendChild(ln);
  var wl=h('div',{style:{fontSize:'12px',color:'var(--dim)'}});wl.textContent=(lg.weeks||[]).length+' weeks';
  headerRow.appendChild(ta);headerRow.appendChild(wl);root.appendChild(headerRow);

  var ltab=S.ltab||'standings';
  var tabs2=['standings','activity','skins','winnings','weeks','handicaps','awards'];
  if(S.isAdmin)tabs2.push('manage');
  var tabRow=h('div',{className:'tabs'});
  var content=h('div');
  var _lgFeedUnsub=null;

  function showLtab(name){
    S.ltab=name;
    if(_lgFeedUnsub){_lgFeedUnsub();_lgFeedUnsub=null;}
    tabRow.querySelectorAll('.tab').forEach(function(t){t.className='tab'+(t.dataset.tab===name?' on':'')});
    content.innerHTML='';
    if(name==='standings')content.appendChild(renderStandings(lg));
    else if(name==='activity'){
      var feedWrap=h('div',{style:{padding:'4px 0'}});
      content.appendChild(feedWrap);
      if(db){
        var ref=feedRef('league',lg.id);
        var handler=ref.orderByChild('ts').limitToLast(100).on('value',function(snap){
          var items=[];snap.forEach(function(c){items.push(c.val());});
          items.reverse();feedWrap.innerHTML='';
          if(!items.length){
            var e=h('div',{style:{textAlign:'center',padding:'40px 16px'}});
            e.appendChild(h('div',{style:{fontSize:'40px',marginBottom:'12px'}},'⛳'));
            var em=h('div',{style:{fontSize:'14px',color:'var(--dim)',lineHeight:'1.6'}});em.textContent='No activity yet. Play a round to see the action here.';
            e.appendChild(em);feedWrap.appendChild(e);return;
          }
          groupFeedItems(items).forEach(function(item){feedWrap.appendChild(renderFeedItem(item));});
        });
        _lgFeedUnsub=function(){ref.off('value',handler);};
      }
    }
    else if(name==='skins')content.appendChild(renderSkinsTab(lg));
    else if(name==='winnings')content.appendChild(renderWinnings(lg));
    else if(name==='weeks')content.appendChild(renderWeeks(lg));
    else if(name==='handicaps')content.appendChild(renderHcps(lg));
    else if(name==='manage')content.appendChild(renderManage(lg));
    else if(name==='awards')content.appendChild(renderAwards(lg));
  }
  var labels={standings:'Standings',activity:'⚡ Activity',skins:'Skins',winnings:'Winnings',weeks:'Weeks',handicaps:'Handicaps',manage:'Manage',awards:'🏆 Awards'};
  tabs2.forEach(function(tv){
    var tb=h('button',{className:'tab'+(tv===ltab?' on':''),onClick:function(){showLtab(tv)}});
    tb.dataset.tab=tv;tb.textContent=labels[tv]||tv;tabRow.appendChild(tb);
  });
  root.appendChild(tabRow);showLtab(ltab);root.appendChild(content);
  root.appendChild(h('div',{style:{height:'8px'}}));
  // Chat
  var lgChatBtn=btn('bs','💬 Chat',function(){openChat('league',lg.id,lg.name,'league');});
  root.appendChild(lgChatBtn);
  if(db){subscribeChatBadge('league',lg.id,function(n){var badge=lgChatBtn.querySelector('.chat-badge');if(n>0){if(!badge){badge=document.createElement('span');badge.className='chat-badge';badge.style.cssText='background:#ef4444;color:#fff;border-radius:10px;padding:1px 6px;font-size:10px;font-weight:700;margin-left:8px;';lgChatBtn.appendChild(badge);}badge.textContent=n;}else if(badge){badge.remove();}});}
  root.appendChild(h('div',{style:{height:'4px'}}));
  root.appendChild(btn('bg','Back',function(){setState({screen:'home'})}));
  return root;
}

function renderStandings(lg){
  var ps=lg.playerStandings||{};
  var frag=document.createDocumentFragment();
  var pCard=card('Player Standings');
  var sorted=Object.values(ps).sort(function(a,b){return b.points-a.points});
  if(!sorted.length){var nd=h('div',{style:{color:'var(--dim)',fontSize:'13px'}});nd.textContent='No results yet.';pCard.appendChild(nd)}
  sorted.forEach(function(p,i){
    var row=h('div',{className:'rrow'});
    var num=h('div',{style:{width:'24px',flexShrink:'0',fontWeight:'700',color:'var(--dim)',fontSize:'20px'}});num.textContent=i+1;
    var dot=h('div',{style:{width:'10px',height:'10px',borderRadius:'50%',background:tc(p.teamId),flexShrink:'0'}});
    var info=h('div',{style:{flex:'1'}});
    var pn=h('div',{style:{fontSize:'15px',color:'var(--cream)',fontWeight:'500'}});pn.textContent=p.name;
    var team=lg.teams.find(function(t){return t.id===p.teamId});
    var ps2=h('div',{style:{fontSize:'11px',color:'var(--dim)'}});ps2.textContent=(team?team.name:'Team '+(p.teamId+1))+' - '+(p.weeksPlayed||0)+' weeks';
    info.appendChild(pn);info.appendChild(ps2);
    var sa=h('div',{style:{textAlign:'right'}});
    var pts=h('div',{className:'big'});pts.textContent=p.points||0;
    var pl=h('div',{style:{fontSize:'10px',color:'var(--dim)'}});pl.textContent='PTS';
    sa.appendChild(pts);sa.appendChild(pl);
    row.appendChild(num);row.appendChild(dot);row.appendChild(info);row.appendChild(sa);pCard.appendChild(row);
  });
  frag.appendChild(pCard);
  var tCard=card('Team Standings');
  var st=lg.teams.slice().sort(function(a,b){return b.points-a.points});
  st.forEach(function(t,i){
    var row=h('div',{className:'rrow'});
    var num=h('div',{style:{width:'24px',flexShrink:'0',fontWeight:'700',color:'var(--dim)',fontSize:'20px'}});num.textContent=i+1;
    var dot=h('div',{style:{width:'10px',height:'10px',borderRadius:'50%',background:tc(t.id),flexShrink:'0'}});
    var info=h('div',{style:{flex:'1'}});
    var tn=h('div',{style:{fontSize:'14px',color:'var(--cream)',fontWeight:'500'}});tn.textContent=t.name;
    var ts=h('div',{style:{fontSize:'11px',color:'var(--dim)'}});ts.textContent=(t.weeksPlayed||0)+' weeks';
    info.appendChild(tn);info.appendChild(ts);
    var sa=h('div',{style:{textAlign:'right'}});
    var tpts=h('div',{style:{fontSize:'24px',color:'var(--gold)',fontWeight:'700'}});tpts.textContent=t.points||0;
    var tl=h('div',{style:{fontSize:'10px',color:'var(--dim)'}});tl.textContent='PTS';
    sa.appendChild(tpts);sa.appendChild(tl);
    row.appendChild(num);row.appendChild(dot);row.appendChild(info);row.appendChild(sa);tCard.appendChild(row);
  });
  var rule=h('div',{style:{height:'1px',background:'rgba(201,168,76,.15)',margin:'8px 0'}});
  var note=h('div',{style:{fontSize:'11px',color:'var(--dim)',lineHeight:'1.8'}});
  note.textContent='1st: 5pts - 2nd: 4pts - 3rd: 3pts - Participation: 1pt - Solo: bonus doubled - Ties: countback (last 6/3/1 holes)';
  tCard.appendChild(rule);tCard.appendChild(note);
  frag.appendChild(h('div',{style:{height:'14px'}}));frag.appendChild(tCard);
  return frag;

    var team=lg.teams.find(function(t){return t.id===p.teamId});

function renderAwards(lg){

    var nt=document.createElement('div');nt.textContent='Awards will appear after the first round is complete.';nd.appendChild(nt);
    frag.appendChild(nd);return frag;
  }

  // Helper to make an award card
  function awardCard(emoji,title,winner,subtitle,detail){
    var c=h('div',{style:{background:'var(--gm)',border:'1px solid rgba(201,168,76,.25)',borderRadius:'var(--r)',padding:'16px',marginBottom:'12px'}});
    var top=h('div',{style:{display:'flex',alignItems:'center',gap:'12px',marginBottom:'8px'}});

    var wn=h('div',{style:{fontSize:'20px',color:'var(--gold)',fontWeight:'700'}});wn.textContent=winner;
    var st=h('div',{style:{fontSize:'12px',color:'var(--dim)',marginTop:'2px'}});st.textContent=subtitle;
    info.appendChild(tt);info.appendChild(wn);info.appendChild(st);
    top.appendChild(ic);top.appendChild(info);
    c.appendChild(top);
    if(detail){var dt=h('div',{style:{fontSize:'12px',color:'var(--dim)',borderTop:'1px solid rgba(255,255,255,.05)',paddingTop:'8px',marginTop:'4px'}});dt.textContent=detail;c.appendChild(dt)}
    return c;
  }

  var title=h('div',{style:{fontWeight:'700',fontSize:'18px',color:'var(--gold)',marginBottom:'4px'}});title.textContent='Season Awards';
  var sub=h('div',{style:{fontSize:'12px',color:'var(--dim)',marginBottom:'16px'}});sub.textContent=weeks.length+' weeks played';
  frag.appendChild(title);frag.appendChild(sub);

  // 1. Champion - most points
  var sorted=ps.slice().sort(function(a,b){return b.points-a.points});
  if(sorted[0])frag.appendChild(awardCard('🏆','Season Champion',sorted[0].name,sorted[0].points+' points','Most points accumulated across the entire season'));

  // 2. Most Skins
  var mostSkins=ps.slice().sort(function(a,b){return(b.skins||0)-(a.skins||0)});
  if(mostSkins[0]&&mostSkins[0].skins>0)frag.appendChild(awardCard('🐊','Skin King',mostSkins[0].name,(mostSkins[0].skins||0)+' skins','Most skins won across all rounds'));

  // 3. Most Consistent - best average net score (min 3 rounds)
  var consistency=[];
  ps.forEach(function(p){
    if((p.weeksPlayed||0)<3)return;
    var playerRounds=rounds.filter(function(r){return r.players&&r.players.some(function(x){return x.name===p.name&&!x.absent})});
    if(!playerRounds.length)return;
    var avgNet=playerRounds.reduce(function(tot,r){
      var pl=r.players.find(function(x){return x.name===p.name});
      return tot+(pl?nTot(pl,r.holes||18):0);
    },0)/playerRounds.length;
    consistency.push({name:p.name,avg:avgNet,rounds:playerRounds.length});
  });
  consistency.sort(function(a,b){return a.avg-b.avg});
  if(consistency[0])frag.appendChild(awardCard('🎯','Most Consistent',consistency[0].name,'Avg net '+consistency[0].avg.toFixed(1)+' over '+consistency[0].rounds+' rounds','Lowest average net score across the season (min 3 rounds)'));

  // 4. Iron Man - most weeks played
  var ironMan=ps.slice().sort(function(a,b){return(b.weeksPlayed||0)-(a.weeksPlayed||0)});
  if(ironMan[0])frag.appendChild(awardCard('💪','Iron Man',ironMan[0].name,(ironMan[0].weeksPlayed||0)+' weeks played','Never missed a round'));

  // 5. Most Improved - biggest handicap drop
  var improved=[];
  ps.forEach(function(p){
    var playerRounds=rounds.filter(function(r){return r.players&&r.players.some(function(x){return x.name===p.name&&!x.absent})});
    if(playerRounds.length<2)return;
    var first=playerRounds[playerRounds.length-1].players.find(function(x){return x.name===p.name});
    var last=playerRounds[0].players.find(function(x){return x.name===p.name});
    if(!first||!last)return;
    var drop=first.handicap-last.handicap;
    if(drop>0)improved.push({name:p.name,drop:drop,from:first.handicap,to:last.handicap});
  });
  improved.sort(function(a,b){return b.drop-a.drop});
  if(improved[0])frag.appendChild(awardCard('📈','Most Improved',improved[0].name,'Handicap dropped from '+improved[0].from+' to '+improved[0].to,'Biggest handicap reduction over the season'));

  // 6. Best single round - lowest net score
  var bestRound={name:'',score:999,course:'',date:''};
  rounds.forEach(function(r){
    (r.players||[]).filter(function(p){return !p.absent}).forEach(function(p){
      var net=nTot(p,r.holes||18);
      if(net>0&&net<bestRound.score){
        bestRound={name:p.name,score:net,course:r.name,date:new Date(r.date).toLocaleDateString('en-US',{month:'short',day:'numeric'})};
      }
    });
  });
  if(bestRound.name)frag.appendChild(awardCard('⭐','Best Single Round',bestRound.name,'Net '+bestRound.score+' -- '+bestRound.date,bestRound.course));

  // 7. Top earner
  var topEarner=ps.slice().sort(function(a,b){return(b.winnings||0)-(a.winnings||0)});
  if(topEarner[0]&&(topEarner[0].winnings||0)>0)frag.appendChild(awardCard('💰','Top Earner',topEarner[0].name,'$'+(topEarner[0].winnings||0).toFixed(2)+' won','Most prize money won across skins and contests'));

  // 8. Season Champion Team - top team by points
  var teams=(lg.teams||[]).slice().sort(function(a,b){return(b.points||0)-(a.points||0)});
  if(teams[0]&&(teams[0].points||0)>0){
    var teamMembers=Object.values(lg.playerStandings||{}).filter(function(p){return p.teamId===teams[0].id}).map(function(p){return p.name}).join(' & ');
    frag.appendChild(awardCard('🥇','Season Champion Team',teams[0].name,teamMembers,'Top team by total points across the season'));
  }

  // 9. Skills Contest King - most CTP and LD wins
  var skillsWins={};
  S.rounds.filter(function(r){return r.leagueId===lg.id&&r.finished&&r.contests}).forEach(function(r){
    var c=r.contests;
    if(c.ctpWinner1){skillsWins[c.ctpWinner1]=(skillsWins[c.ctpWinner1]||0)+1}
    if(c.ctpWinner2){skillsWins[c.ctpWinner2]=(skillsWins[c.ctpWinner2]||0)+1}
    if(c.ldWinner){skillsWins[c.ldWinner]=(skillsWins[c.ldWinner]||0)+1}
  });
  var skillsSorted=Object.keys(skillsWins).map(function(k){return[k,skillsWins[k]]}).sort(function(a,b){return b[1]-a[1]});
  if(skillsSorted.length>0){
    // Count breakdown per winner
    var breakdown=[];
    S.rounds.filter(function(r){return r.leagueId===lg.id&&r.finished&&r.contests}).forEach(function(r){
      var c=r.contests;
      var name=skillsSorted[0][0];
      var wins=[];
      if(c.ctpWinner1===name)wins.push('CTP');
      if(c.ctpWinner2===name)wins.push('CTP');
      if(c.ldWinner===name)wins.push('Long Drive');
      if(wins.length)breakdown.push(wins.join(' + '));
    });
    frag.appendChild(awardCard('🎯','Skills Contest King',skillsSorted[0][0],skillsSorted[0][1]+' contest win'+(skillsSorted[0][1]>1?'s':''),'Most closest to the pin and longest drive wins combined'));
  }

  return frag;
}

// Stableford points calculation
function stablefordPts(gross,handicap,holeIndex,par){
  if(!gross)return 0;
  var strokes=handicap>=holeIndex?1:0;
  if(handicap>=(holeIndex+18))strokes=2; // double allocation for high hcps
  var net=gross-strokes;
  var diff=net-par;
  if(diff<=-2)return 4; // eagle or better
  if(diff===-1)return 3; // birdie
  if(diff===0)return 2;  // par
  if(diff===1)return 1;  // bogey
  return 0;              // double bogey or worse
}

function tripTotalPts(player,trip){
  var total=0;
  (trip.rounds||[]).forEach(function(r){
    if(!r.finished)return;
    var pdata=(r.players||[]).find(function(p){return p.name===player.name});
    if(!pdata)return;
    var pars=r.pars||Array(18).fill(4);
    var hdcp=r.hdcp||Array(18).fill(10);
    pdata.scores.forEach(function(g,h){
      total+=stablefordPts(g,pdata.handicap,hdcp[h],pars[h]);
    });
  });
  return total;
}

    myPlayer=(trip.players||[]).find(function(p){return p.name===scoringAs});
    if(myPlayer)myPlayer=Object.assign({},myPlayer,{scores:Array(18).fill(0)});
  }
  if(!myPlayer){setState({screen:'tripHome'});return}

  if(!S.tripScores)S.tripScores={};
  if(!S.tripScores[scoringAs]){
    S.tripScores[scoringAs]=myPlayer.scores?myPlayer.scores.slice():Array(18).fill(0);
  } else {
    // Merge: use local scores but fill in any holes from Firebase that are missing locally
    var liveTripPlayer=(live.players||[]).find(function(p){return p.name===scoringAs});
    if(liveTripPlayer&&liveTripPlayer.scores){

function tripPlayerScore(player,liveRound){
  // Returns the scoring metric for a player based on round mode
  var pars=liveRound.pars||Array(18).fill(4);
  var hdcp=liveRound.hdcp||Array(18).fill(10);
  var mode=liveRound.mode||'stableford';
  var phcp=player.playingHandicap!==undefined?player.playingHandicap:player.handicap;
  if(mode==='stroke'){
    return player.scores.reduce(function(t,g,h){return t+(g?netS(g,phcp,h,hdcp):0)},0);
  }
  return player.scores.reduce(function(t,g,h){return t+stablefordPts(g,phcp,hdcp[h],pars[h])},0);
}

function finalizeTripRound(liveRound,trip){
  var pars=liveRound.pars||Array(18).fill(4);
  var hdcp=liveRound.hdcp||Array(18).fill(10);
  var isPractice=liveRound.roundType==='practice';
  var mode=liveRound.mode||'stableford';
  var holes=liveRound.holes||18;
  var players=liveRound.players||[];

  var playerPts={};
  players.forEach(function(p){playerPts[p.name]=tripPlayerScore(p,liveRound);});

  // Calculate trip skins (individual player net scores)
  var skinsResult=null;
  if(liveRound.skins&&liveRound.skins.active){
    var skinPlayers=players.map(function(p){return{name:p.name,scores:p.scores,handicap:p.handicap}});
    var tripSkinsData=calcSkins(skinPlayers,holes,hdcp);
    var totalPot=(liveRound.skins.amountPerPlayer||10)*players.length;
    var totalSkins=Object.values(tripSkinsData.cnt).reduce(function(a,b){return a+b},0);
    var skinWinnings={};
    if(totalSkins>0){
      Object.keys(tripSkinsData.cnt).forEach(function(name){
        if(tripSkinsData.cnt[name]>0)skinWinnings[name]=Math.round((tripSkinsData.cnt[name]/totalSkins)*totalPot*100)/100;
      });
    }
    skinsResult={cnt:tripSkinsData.cnt,detail:tripSkinsData.detail,totalPot:totalPot,winnings:skinWinnings};
  }

  // Calculate trip nassau (individual net scores)
  var nassauResult=null;
  if(liveRound.nassau&&liveRound.nassau.active){
    var isStrokeMode=mode==='stroke';
    var nassauEntries=players.map(function(p){
      return{id:p.name,name:p.name,holeScore:function(h){
        var g=p.scores[h]||0;
        if(!g)return 0;
        if(isStrokeMode)return netS(g,p.handicap,h,hdcp);
        return stablefordPts(g,p.handicap,hdcp[h],pars[h]);
      }};
    });
    nassauResult=isStrokeMode?
      calcNassau(nassauEntries,holes,pars,hdcp,true):
      calcNassauStableford(nassauEntries,holes,pars,hdcp);
    nassauResult.amountPerLeg=liveRound.nassau.amountPerLeg||5;
    nassauResult.mode=mode;
  }

  var finishedRound=Object.assign({},liveRound,{finalized:true,skinsResult:skinsResult,nassauResult:nassauResult});
  var updatedTrip=Object.assign({},trip,{
    rounds:(trip.rounds||[]).map(function(r){
      return r.id===liveRound.id?Object.assign({},r,{finished:true,playerPts:playerPts,isPractice:isPractice,skinsResult:skinsResult,nassauResult:nassauResult,mode:mode,players:players}):r;
    })
  });
  // ── Activity feed events ──────────────────────────────────────────────────
  if(!isPractice){
    var courseName2=liveRound.courseName||'the course';
    var roundNum2=updatedTrip.rounds.findIndex(function(r){return r.id===liveRound.id;})+1;
    writeFeedItem('trip',trip.id,trip.name,'round_complete','',
      'Round '+roundNum2+' at '+courseName2+' is complete 🏁');

    // Birdie / Eagle detection
    players.forEach(function(p){
      var pPars=pars||Array(18).fill(4);
      var eagles=[],birdies=[];
      (p.scores||[]).forEach(function(g,hi){
        if(!g)return;
        var diff=g-pPars[hi];
        if(diff<=-2)eagles.push(hi+1);
        else if(diff===-1)birdies.push(hi+1);
      });
      if(eagles.length){
        writeFeedItem('trip',trip.id,trip.name,'eagle',p.name,
          p.name+' made '+(eagles.length>1?eagles.length+' eagles':'an eagle')+' 🦅 (hole'+( eagles.length>1?'s ':' ')+eagles.join(', ')+')');
      } else if(birdies.length>=3){
        writeFeedItem('trip',trip.id,trip.name,'birdie',p.name,
          p.name+' had '+birdies.length+' birdies 🐦🐦🐦');
      } else if(birdies.length>0){
        writeFeedItem('trip',trip.id,trip.name,'birdie',p.name,
          p.name+' birdied hole'+(birdies.length>1?'s ':' ')+birdies.join(', ')+' 🐦');
      }
    });

    // Trip leaderboard leader after this round
    var sortedPts=players.slice().sort(function(a,b){
      return (playerPts[b.name]||0)-(playerPts[a.name]||0);
    });

    // Cumulative trip standings -- check who leads overall
    var cumulative={};
    (trip.players||[]).forEach(function(p){cumulative[p.name]=0;});
    (updatedTrip.rounds||[]).filter(function(r){return r.finished&&!r.isPractice;}).forEach(function(r){
      Object.keys(r.playerPts||{}).forEach(function(name){cumulative[name]=(cumulative[name]||0)+(r.playerPts[name]||0);});
    });
    var leaderEntry=Object.entries(cumulative).sort(function(a,b){return b[1]-a[1];})[0];
    if(leaderEntry&&leaderEntry[1]>0){
      writeFeedItem('trip',trip.id,trip.name,'leaderboard_move',leaderEntry[0],
        leaderEntry[0]+' leads the trip with '+leaderEntry[1]+' pts 🔼');
    }

    // Skins winners
    if(skinsResult&&skinsResult.winnings){
      Object.keys(skinsResult.winnings).forEach(function(name){
        var amt=skinsResult.winnings[name];
        writeFeedItem('trip',trip.id,trip.name,'skins_won',name,
          name+' won $'+amt.toFixed(2)+' in skins 💰');
      });
    }
  }

  // Check if all competition rounds are now done -- archive the trip
  var allCompDone=(updatedTrip.rounds||[]).filter(function(r){return !r.isPractice}).every(function(r){return r.finished;});
  var compDoneCount=(updatedTrip.rounds||[]).filter(function(r){return !r.isPractice&&r.finished;}).length;
  if(allCompDone&&compDoneCount>0){
    // Build final standings
    var finalStandings={};
    (updatedTrip.players||[]).forEach(function(p){finalStandings[p.name]=0;});
    (updatedTrip.rounds||[]).filter(function(r){return r.finished&&!r.isPractice;}).forEach(function(r){
      Object.keys(r.playerPts||{}).forEach(function(name){finalStandings[name]=(finalStandings[name]||0)+(r.playerPts[name]||0);});
    });
    var champion=Object.entries(finalStandings).sort(function(a,b){return b[1]-a[1];})[0];
    var archive={
      completedAt:new Date().toISOString(),
      playerCount:(updatedTrip.players||[]).length,
      roundCount:compDoneCount,
      finalStandings:finalStandings,
      champion:champion?{name:champion[0],pts:champion[1]}:null,
      courses:(updatedTrip.rounds||[]).filter(function(r){return !r.isPractice&&r.courseName;}).map(function(r){return r.courseName;}),
      mode:mode
    };
    updatedTrip=Object.assign({},updatedTrip,{status:'complete',archive:archive});
    // Write archive feed item
    writeFeedItem('trip',trip.id,trip.name,'round_complete','',
      '🏆 Trip complete! '+(champion?champion[0]+' wins with '+champion[1]+' pts':'All rounds finished'));
  }

  Promise.all([pushLive(finishedRound),pushTrip(updatedTrip)]).then(function(){
    pull().then(function(){setState({screen:'tripHome'})});
  });
}

  var isStrokeTrip=currentMode==='stroke';

    var rMode=r.mode||'stableford';

      Object.keys(r.playerPts).forEach(function(name){
        if(!practiceTotals[name])practiceTotals[name]={name:name,pts:0,rounds:[]};
        practiceTotals[name].pts+=r.playerPts[name];
        practiceTotals[name].rounds.push({courseName:r.courseName,pts:r.playerPts[name]});

        if(rMode==='stroke'){
          playerTotals[name].strokes+=r.playerPts[name]; // playerPts stores net strokes for stroke rounds
        } else {
          playerTotals[name].pts+=r.playerPts[name];
        }
        playerTotals[name].roundPts.push({val:r.playerPts[name],mode:rMode,course:r.courseName});

function screenTripGroupSetup(){
  var trip=getTrip();var live=S.live;
  if(!trip){setState({screen:'tripHome'});return}
  setHdr('Groups',trip.name);
  var root=h('div',{className:'screen'});
  var players=trip.players||[];
  var allRounds=(trip.rounds||[]);

  // Determine which round to edit
  // Default: live round if active, else first non-finished round, else round 0
  var usingLive=!!(live&&live.tripId===trip.id&&!live.finalized);
  var defaultRoundIdx=0;
  if(usingLive){
    var liveIdx=allRounds.findIndex(function(r){return r.id===live.id;});
    if(liveIdx>=0)defaultRoundIdx=liveIdx;
  } else {
    var firstUnfinished=allRounds.findIndex(function(r){return !r.finished;});
    if(firstUnfinished>=0)defaultRoundIdx=firstUnfinished;
  }
  var selectedRoundIdx=S._groupRoundIdx!=null?S._groupRoundIdx:defaultRoundIdx;
  S._groupRoundIdx=selectedRoundIdx;
  var selectedRound=allRounds[selectedRoundIdx]||allRounds[0];

  root.appendChild(roundLabel);

  var unassigned=players.filter(function(p){
    return !groups.some(function(g){return g&&g.players&&g.players.indexOf(p.name)>=0});
  });

  // Unassigned players
  if(unassigned.length>0){
    var uCard=card('Unassigned Players ('+unassigned.length+')');
    var uNote=h('div',{style:{fontSize:'11px',color:'var(--dim)',marginBottom:'8px'}});uNote.textContent='Tap a player to assign them to a group';
    uCard.appendChild(uNote);
    unassigned.forEach(function(p){
      var row=h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'6px 0',borderBottom:'1px solid rgba(255,255,255,.05)'}});
      var pn=h('div',{style:{fontSize:'14px',color:'var(--cream)'}});pn.textContent=p.name+' (HCP '+p.handicap+')';
      var gSel=h('select',{style:{background:'rgba(30,30,30,.95)',border:'1px solid rgba(201,168,76,.5)',borderRadius:'6px',color:'var(--cream)',padding:'6px 10px',fontSize:'13px',fontWeight:'600'}});
      var defO=document.createElement('option');defO.value='';defO.textContent='Add to...';gSel.appendChild(defO);
      groups.forEach(function(g,gi2){
        var o=document.createElement('option');o.value=gi2;o.textContent=g.name+' ('+((g.players||[]).length)+')';gSel.appendChild(o);
      });
      gSel.addEventListener('change',function(){
        if(this.value==='')return;
        var gi3=parseInt(this.value);
        groups[gi3].players.push(p.name);
        if(!groups[gi3].scorer)groups[gi3].scorer=p.name; // first player is default scorer
        var gt=getTrip();if(gt)writeFeedItem('trip',gt.id,gt.name,'announcement','Admin','Pairings have been updated 📋');saveGroups();setState({screen:'tripGroupSetup'});
      });
      row.appendChild(pn);row.appendChild(gSel);uCard.appendChild(row);
    });
    root.appendChild(uCard);
  }

  // Groups
  groups.forEach(function(g,gi){
    var gCard=card('👥 '+g.name+' -- '+((g.players||[]).length)+' player'+((g.players||[]).length===1?'':'s'));
    (g.players||[]).forEach(function(pname){

      var scorerBadge=h('div',{style:{fontSize:'10px',color:g.scorer===pname?'var(--gold)':'var(--dim)',marginTop:'2px'}});scorerBadge.textContent=g.scorer===pname?'⭐ Scorer':'';

          onClick:function(){
            groups[gi].scorer=pname;
            var gt=getTrip();if(gt)writeFeedItem('trip',gt.id,gt.name,'announcement','Admin','Pairings have been updated 📋');saveGroups();setState({screen:'tripGroupSetup'});

      });
      // Remove option
      var removeO=document.createElement('option');removeO.value='remove';removeO.textContent='Remove';moveSel.appendChild(removeO);
      moveSel.addEventListener('change',function(){
        if(this.value==='')return;
        groups[gi].players=groups[gi].players.filter(function(n){return n!==pname});
        if(groups[gi].scorer===pname)groups[gi].scorer=groups[gi].players[0]||null;
        if(this.value!=='remove'){

        }

      });
